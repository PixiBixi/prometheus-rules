        values: '1x40 _x30 1x20'
      - series: 'externalsecret_status_condition{name="h12",namespace="a",condition="Ready",status="True"}'
        values: '1x40 _x30 1x20'
      - series: 'externalsecret_status_condition{name="h13",namespace="a",condition="Ready",status="True"}'
        values: '1x40 _x30 1x20'
      - series: 'externalsecret_status_condition{name="h14",namespace="a",condition="Ready",status="True"}'
        values: '1x40 _x30 1x20'
      - series: 'externalsecret_status_condition{name="h15",namespace="a",condition="Ready",status="True"}'
        values: '1x40 _x30 1x20'
