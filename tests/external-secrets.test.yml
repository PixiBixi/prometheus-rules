# Regression tests for rules/external-secrets.rules.yml
rule_files:
  - external-secrets.rules.yml

evaluation_interval: 1m

tests:
  # 10 objects, 4 failing: 40%, above both thresholds but only 4 failing.
  - interval: 1m
    name: a fleet-wide sync failure warns, the absolute floor holds the page
    input_series:
      - series: 'externalsecret_status_condition{name="s1",namespace="a",condition="Ready",status="False"}'
        values: '1x30'
      - series: 'externalsecret_status_condition{name="s2",namespace="a",condition="Ready",status="False"}'
        values: '1x30'
      - series: 'externalsecret_status_condition{name="s3",namespace="a",condition="Ready",status="False"}'
        values: '1x30'
      - series: 'externalsecret_status_condition{name="s4",namespace="a",condition="Ready",status="False"}'
        values: '1x30'
      - series: 'externalsecret_status_condition{name="s5",namespace="a",condition="Ready",status="True"}'
        values: '1x30'
      - series: 'externalsecret_status_condition{name="s6",namespace="a",condition="Ready",status="True"}'
        values: '1x30'
      - series: 'externalsecret_status_condition{name="s7",namespace="a",condition="Ready",status="True"}'
        values: '1x30'
      - series: 'externalsecret_status_condition{name="s8",namespace="a",condition="Ready",status="True"}'
        values: '1x30'
      - series: 'externalsecret_status_condition{name="s9",namespace="a",condition="Ready",status="True"}'
        values: '1x30'
      - series: 'externalsecret_status_condition{name="s10",namespace="a",condition="Ready",status="True"}'
        values: '1x30'
    alert_rule_test:
      - alertname: ExternalSecretsSyncDegraded
        eval_time: 20m
        exp_alerts:
          - exp_labels:
              alertname: ExternalSecretsSyncDegraded
              severity: warning
            exp_annotations:
              summary: "More than 5% of ExternalSecrets are failing to sync"
              description: "40% of ExternalSecrets have been Ready=False for 15 minutes. A shared cause (secret store credentials, IAM binding) is far more likely than that many independent failures."
      - alertname: ExternalSecretsSyncMassFailure
        eval_time: 20m
        exp_alerts: []

  # Operator restart: 1 permanently failing object out of 20. The 19 healthy
  # series vanish for 30 minutes and come back; the failing one never leaves.
  # A bare count denominator would read 100% during the gap.
  - interval: 1m
    name: an operator restart does not spike the failure ratio
    input_series:
      - series: 'externalsecret_status_condition{name="broken",namespace="a",condition="Ready",status="False"}'
        values: '1x90'
      - series: 'externalsecret_status_condition{name="h1",namespace="a",condition="Ready",status="True"}'
        values: '1x40 _x30 1x20'
      - series: 'externalsecret_status_condition{name="h2",namespace="a",condition="Ready",status="True"}'
        values: '1x40 _x30 1x20'
      - series: 'externalsecret_status_condition{name="h3",namespace="a",condition="Ready",status="True"}'
        values: '1x40 _x30 1x20'
      - series: 'externalsecret_status_condition{name="h4",namespace="a",condition="Ready",status="True"}'
        values: '1x40 _x30 1x20'
      - series: 'externalsecret_status_condition{name="h5",namespace="a",condition="Ready",status="True"}'
        values: '1x40 _x30 1x20'
      - series: 'externalsecret_status_condition{name="h6",namespace="a",condition="Ready",status="True"}'
        values: '1x40 _x30 1x20'
      - series: 'externalsecret_status_condition{name="h7",namespace="a",condition="Ready",status="True"}'
        values: '1x40 _x30 1x20'
      - series: 'externalsecret_status_condition{name="h8",namespace="a",condition="Ready",status="True"}'
        values: '1x40 _x30 1x20'
