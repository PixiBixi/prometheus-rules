# Regression tests for rules/kubernetes.rules.yml
rule_files:
  - kubernetes.rules.yml
  - k8s.records.yml

evaluation_interval: 1m

tests:
  # The certificate alerts used a bare `and`, which matches on the full label
  # set: {job,instance,...} on the left against {job} on the right, since
  # histogram_quantile consumes `le`. Nothing ever matched.
  - interval: 1m
    name: client certificate expiry is detected 12h out
    input_series:
      - series: 'apiserver_client_certificate_expiration_seconds_count{job="apiserver",instance="api1"}'
        values: '0+10x10'
      - series: 'apiserver_client_certificate_expiration_seconds_bucket{job="apiserver",instance="api1",le="21600"}'
        values: '0x10'
      - series: 'apiserver_client_certificate_expiration_seconds_bucket{job="apiserver",instance="api1",le="43200"}'
        values: '0+10x10'
      - series: 'apiserver_client_certificate_expiration_seconds_bucket{job="apiserver",instance="api1",le="+Inf"}'
        values: '0+10x10'
    alert_rule_test:
      - alertname: KubernetesClientCertificateExpiresSoon
        eval_time: 8m
        exp_alerts:
          - exp_labels:
              alertname: KubernetesClientCertificateExpiresSoon
              instance: api1
              job: apiserver
              severity: critical
            exp_annotations:
              summary: "Kubernetes client certificate expires soon"
              description: "A client certificate used to authenticate to the apiserver expires within 24 hours"
      - alertname: KubernetesClientCertificateExpiresNextWeek
        eval_time: 8m
        exp_alerts:
          - exp_labels:
              alertname: KubernetesClientCertificateExpiresNextWeek
              instance: api1
              job: apiserver
              severity: warning
            exp_annotations:
              summary: "Kubernetes client certificate expires next week"
              description: "A client certificate used to authenticate to the apiserver expires within 7 days"

  # KubernetesCronjobTooLong combined per-job series with absent(), which is
  # global: it went empty as soon as any one job in the cluster completed.
  # The second job here is what made the old form undetectable.
  - interval: 1m
    name: a long-running job is detected even when another job has completed
    input_series:
      - series: 'kube_job_status_start_time{namespace="batch",job_name="etl-1",job="ksm",instance="ksm"}'
        values: '1x200'
      - series: 'kube_job_status_start_time{namespace="batch",job_name="done-1",job="ksm",instance="ksm"}'
        values: '1x200'
      - series: 'kube_job_status_completion_time{namespace="batch",job_name="done-1",job="ksm",instance="ksm"}'
        values: '100x200'
    alert_rule_test:
      - alertname: KubernetesJobRunningTooLong
        eval_time: 120m
        exp_alerts:
          - exp_labels:
              alertname: KubernetesJobRunningTooLong
              namespace: batch
              job_name: etl-1
              job: ksm
              instance: ksm
              severity: warning
            exp_annotations:
              summary: "Kubernetes Job running too long (batch/etl-1)"
              description: "Job batch/etl-1 is taking more than 1 hour to complete"

  # A pod left behind in Failed by a completed Job stays in that phase forever.
  - interval: 1m
    name: a Failed pod left by a Job does not page as unhealthy
    input_series:
      - series: 'kube_pod_status_phase{phase="Failed",namespace="batch",pod="etl-abc",job="ksm",instance="ksm"}'
        values: '1x40'
    alert_rule_test:
      - alertname: KubernetesPodNotHealthy
        eval_time: 30m
        exp_alerts: []

  - interval: 1m
    name: a genuinely Pending pod still pages
    input_series:
      - series: 'kube_pod_status_phase{phase="Pending",namespace="app",pod="web-1",job="ksm",instance="ksm"}'
        values: '1x40'
    alert_rule_test:
      - alertname: KubernetesPodNotHealthy
        eval_time: 30m
        exp_alerts:
          - exp_labels: {alertname: KubernetesPodNotHealthy, namespace: app, pod: web-1, severity: critical}
            exp_annotations:
              summary: "Kubernetes pod not healthy (app/web-1)"
              description: "Pod app/web-1 has been in a non-running state for more than 15 minutes"

  # A Job that failed once then succeeded on retry should not keep paging.
  - interval: 1m
    name: a Job that succeeded after a retry does not page
    input_series:
      - series: 'kube_job_status_failed{namespace="batch",job_name="etl-1",job="ksm",instance="ksm"}'
        values: '1x20'
      - series: 'kube_job_status_succeeded{namespace="batch",job_name="etl-1",job="ksm",instance="ksm"}'
        values: '1x20'
    alert_rule_test:
      - alertname: KubernetesJobFailed
        eval_time: 10m
        exp_alerts: []

  - interval: 1m
    name: a Job that only ever failed still pages
    input_series:
      - series: 'kube_job_status_failed{namespace="batch",job_name="etl-2",job="ksm",instance="ksm"}'
        values: '1x20'
      - series: 'kube_job_status_succeeded{namespace="batch",job_name="etl-2",job="ksm",instance="ksm"}'
        values: '0x20'
    alert_rule_test:
      - alertname: KubernetesJobFailed
        eval_time: 10m
        exp_alerts:
          - exp_labels: {alertname: KubernetesJobFailed, namespace: batch, job_name: etl-2, job: ksm, instance: ksm, severity: warning}
            exp_annotations:
              summary: "Kubernetes job failed (batch/etl-2)"
              description: "Job batch/etl-2 failed to complete"

  # A volume with plenty of headroom should not page on one transient dip.
  - interval: 1m
    name: a mostly-empty volume does not page on a transient write burst
    input_series:
      - series: 'kubelet_volume_stats_available_bytes{namespace="app",persistentvolumeclaim="data",job="kubelet",instance="n1"}'
        values: '900-1x60'
      - series: 'kubelet_volume_stats_capacity_bytes{namespace="app",persistentvolumeclaim="data",job="kubelet",instance="n1"}'
        values: '1000x60'
    alert_rule_test:
      - alertname: KubernetesVolumeFullInFourDays
        eval_time: 50m
        exp_alerts: []

  # A CronJob that has never once succeeded has no last_successful_time series,
  # so the `last_schedule > last_successful` comparison returned nothing and the
  # worst case went undetected.
  - interval: 1m
    name: a CronJob that never succeeded is detected
    input_series:
      - series: 'kube_cronjob_status_last_schedule_time{namespace="batch",cronjob="nightly",job="ksm",instance="ksm"}'
        values: '1000x20'
      - series: 'kube_cronjob_status_active{namespace="batch",cronjob="nightly",job="ksm",instance="ksm"}'
        values: '0x20'
      - series: 'kube_cronjob_spec_suspend{namespace="batch",cronjob="nightly",job="ksm",instance="ksm"}'
        values: '0x20'
    alert_rule_test:
      - alertname: KubernetesCronjobFailing
        eval_time: 10m
        exp_alerts:
          - exp_labels:
              alertname: KubernetesCronjobFailing
              namespace: batch
              cronjob: nightly
              job: ksm
              instance: ksm
              severity: critical
            exp_annotations:
              summary: "Kubernetes CronJob failing (batch/nightly)"
              description: "CronJob batch/nightly last schedule did not complete successfully"

  - interval: 1m
    name: a CronJob that succeeded after its last schedule is quiet
    input_series:
      - series: 'kube_cronjob_status_last_schedule_time{namespace="batch",cronjob="ok",job="ksm",instance="ksm"}'
        values: '1000x20'
      - series: 'kube_cronjob_status_last_successful_time{namespace="batch",cronjob="ok",job="ksm",instance="ksm"}'
        values: '1100x20'
      - series: 'kube_cronjob_status_active{namespace="batch",cronjob="ok",job="ksm",instance="ksm"}'
        values: '0x20'
      - series: 'kube_cronjob_spec_suspend{namespace="batch",cronjob="ok",job="ksm",instance="ksm"}'
        values: '0x20'
    alert_rule_test:
      - alertname: KubernetesCronjobFailing
        eval_time: 10m
        exp_alerts: []

  # kube_job_status_failed gains a `reason` label once failed > 0, which broke
  # the subtraction and dropped partially-failed jobs from the result.
  - interval: 1m
    name: a job with partial failures stays visible to the completion check
    input_series:
      - series: 'kube_job_spec_completions{namespace="batch",job_name="etl",job="ksm",instance="ksm"}'
        values: '5x800'
      - series: 'kube_job_status_succeeded{namespace="batch",job_name="etl",job="ksm",instance="ksm"}'
        values: '2x800'
      - series: 'kube_job_status_failed{namespace="batch",job_name="etl",job="ksm",instance="ksm",reason="BackoffLimitExceeded"}'
        values: '1x800'
    alert_rule_test:
      - alertname: KubernetesJobSlowCompletion
        eval_time: 13h
        exp_alerts:
          - exp_labels:
              alertname: KubernetesJobSlowCompletion
              namespace: batch
              job_name: etl
              job: ksm
              instance: ksm
              severity: critical
            exp_annotations:
              summary: "Kubernetes job slow completion (batch/etl)"
              description: "Job batch/etl did not complete within 12 hours"

  # 0.1 CPU used out of 2 requested: 5% of the request, 1.9 CPU idle.
  - interval: 1m
    name: a namespace far below its CPU request is flagged
    input_series:
      - series: 'kube_pod_container_resource_requests{resource="cpu",namespace="ns-idle",pod="p1",container="app",instance="ksm",job="ksm",dc="dc1",k8s_cluster_name="c1",node="n1"}'
        values: '2x800'
      - series: 'kube_pod_container_status_running{namespace="ns-idle",pod="p1",container="app",instance="ksm",job="ksm",dc="dc1",k8s_cluster_name="c1"}'
        values: '1x800'
      - series: 'container_cpu_usage_seconds_total{namespace="ns-idle",pod="p1",container="app",image="app:1",instance="n1",job="kubelet",dc="dc1",k8s_cluster_name="c1"}'
        values: '0+6x800'
    alert_rule_test:
      - alertname: KubernetesNamespaceCpuRequestUnderused
        eval_time: 7h
        exp_alerts:
          - exp_labels:
              alertname: KubernetesNamespaceCpuRequestUnderused
              dc: dc1
              k8s_cluster_name: c1
              namespace: ns-idle
              severity: warning
            exp_annotations:
              summary: "Kubernetes namespace CPU request underused (ns-idle)"
              description: "Namespace ns-idle has averaged 5% of its CPU request over the last 6h - consider lowering requests"

  # 1m used out of 50m: 2% of the request, but only 49m to reclaim.
  - interval: 1m
    name: a small controller below the absolute floor stays quiet
    input_series:
      - series: 'kube_pod_container_resource_requests{resource="cpu",namespace="ns-small",pod="p1",container="app",instance="ksm",job="ksm",dc="dc1",k8s_cluster_name="c1",node="n1"}'
        values: '0.05x800'
      - series: 'kube_pod_container_status_running{namespace="ns-small",pod="p1",container="app",instance="ksm",job="ksm",dc="dc1",k8s_cluster_name="c1"}'
        values: '1x800'
      - series: 'container_cpu_usage_seconds_total{namespace="ns-small",pod="p1",container="app",image="app:1",instance="n1",job="kubelet",dc="dc1",k8s_cluster_name="c1"}'
        values: '0+0.06x800'
    alert_rule_test:
      - alertname: KubernetesNamespaceCpuRequestUnderused
        eval_time: 7h
        exp_alerts: []

  # 100Mi working set out of a 4Gi request.
  - interval: 1m
    name: a namespace far below its memory request is flagged
    input_series:
      - series: 'kube_pod_container_resource_requests{resource="cpu",namespace="ns-fat",pod="p1",container="app",instance="ksm",job="ksm",dc="dc1",k8s_cluster_name="c1",node="n1"}'
        values: '1x800'
      - series: 'kube_pod_container_resource_requests{resource="memory",namespace="ns-fat",pod="p1",container="app",instance="ksm",job="ksm",dc="dc1",k8s_cluster_name="c1",node="n1"}'
        values: '4294967296x800'
      - series: 'kube_pod_container_status_running{namespace="ns-fat",pod="p1",container="app",instance="ksm",job="ksm",dc="dc1",k8s_cluster_name="c1"}'
        values: '1x800'
      - series: 'container_cpu_usage_seconds_total{namespace="ns-fat",pod="p1",container="app",image="app:1",instance="n1",job="kubelet",dc="dc1",k8s_cluster_name="c1"}'
        values: '0+60x800'
      - series: 'container_memory_working_set_bytes{namespace="ns-fat",pod="p1",container="app",image="app:1",instance="n1",job="kubelet",dc="dc1",k8s_cluster_name="c1"}'
        values: '104857600x800'
    alert_rule_test:
      - alertname: KubernetesNamespaceMemoryRequestUnderused
        eval_time: 7h
        exp_alerts:
          - exp_labels:
              alertname: KubernetesNamespaceMemoryRequestUnderused
              dc: dc1
              k8s_cluster_name: c1
              namespace: ns-fat
              severity: warning
            exp_annotations:
              summary: "Kubernetes namespace memory request underused (ns-fat)"
              description: "Namespace ns-fat has averaged 2.441% of its memory request over the last 6h - consider lowering requests"

  - interval: 1m
    name: nodes without a cAdvisor target are detected
    input_series:
      - series: 'kube_node_info{node="n1",instance="ksm",job="ksm"}'
        values: '1x30'
      - series: 'kube_node_info{node="n2",instance="ksm",job="ksm"}'
        values: '1x30'
      - series: 'kube_node_info{node="n3",instance="ksm",job="ksm"}'
        values: '1x30'
      - series: 'kube_node_info{node="n4",instance="ksm",job="ksm"}'
        values: '1x30'
      - series: 'up{node="n1",instance="10.0.0.1:10250",job="kubelet",metrics_path="/metrics/cadvisor"}'
        values: '1x30'
      - series: 'up{node="n2",instance="10.0.0.2:10250",job="kubelet",metrics_path="/metrics/cadvisor"}'
        values: '1x30'
    alert_rule_test:
      - alertname: KubernetesKubeletScrapeCoverageDegraded
        eval_time: 20m
        exp_alerts:
          - exp_labels:
              alertname: KubernetesKubeletScrapeCoverageDegraded
              severity: warning
            exp_annotations:
              summary: "Kubernetes kubelet scrape coverage degraded"
              description: "2 nodes have no kubelet cAdvisor scrape target, so per-pod CPU and memory metrics are missing for them"

  - interval: 1m
    name: a single node without a cAdvisor target stays quiet
    input_series:
      - series: 'kube_node_info{node="n1",instance="ksm",job="ksm"}'
        values: '1x30'
      - series: 'kube_node_info{node="n2",instance="ksm",job="ksm"}'
        values: '1x30'
      - series: 'up{node="n1",instance="10.0.0.1:10250",job="kubelet",metrics_path="/metrics/cadvisor"}'
        values: '1x30'
    alert_rule_test:
      - alertname: KubernetesKubeletScrapeCoverageDegraded
        eval_time: 20m
        exp_alerts: []
