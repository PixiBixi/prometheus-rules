# Regression tests for rules/basis.rules.yml
rule_files:
  - basis.rules.yml
  - basis.records.yml

evaluation_interval: 1m

tests:
  # DownSystemdCron / SSH / OpenVPN used `name=` with regex metacharacters.
  # `=` is an exact match, so they looked for units literally called
  # "crond?.service" and matched nothing.
  - interval: 1m
    name: systemd unit selectors match real unit names
    input_series:
      - series: 'node_systemd_unit_state{state="failed",name="cron.service",instance="h1",job="node-exporter",type="simple"}'
        values: '1x5'
      - series: 'node_systemd_unit_state{state="failed",name="ssh.service",instance="h1",job="node-exporter",type="simple"}'
        values: '1x5'
      - series: 'node_systemd_unit_state{state="failed",name="openvpn-client@corp.service",instance="h1",job="node-exporter",type="simple"}'
        values: '1x5'
      # Decoy: `\.` must match a literal dot, so this must NOT be picked up.
      - series: 'node_systemd_unit_state{state="failed",name="crondXservice",instance="h1",job="node-exporter",type="simple"}'
        values: '1x5'
    promql_expr_test:
      - expr: 'count(ALERTS{alertname=~"DownSystemdCron|DownSystemdSSH|DownSystemdOpenVPN",alertstate="firing"})'
        eval_time: 3m
        exp_samples:
          - labels: '{}'
            value: 3

  # RaidDegraded summed node_md_disks across all states, giving the number of
  # disks present -- invariant exactly when a disk goes active -> failed.
  - interval: 1m
    name: RaidDegraded fires when a disk drops out of the array
    input_series:
      - series: 'node_md_disks{device="md2",state="active",instance="h1",job="node-exporter"}'
        values: '1x5'
      - series: 'node_md_disks{device="md2",state="failed",instance="h1",job="node-exporter"}'
        values: '1x5'
      - series: 'node_md_disks{device="md2",state="spare",instance="h1",job="node-exporter"}'
        values: '0x5'
      - series: 'node_md_disks_required{device="md2",instance="h1",job="node-exporter"}'
        values: '2x5'
    alert_rule_test:
      - alertname: RaidDegraded
        eval_time: 3m
        exp_alerts:
          - exp_labels:
              alertname: RaidDegraded
              device: md2
              instance: h1
              job: node-exporter
              severity: critical
            exp_annotations:
              summary: "MDRaid is degraded md2 for h1"
              description: "A disk seems disabled by kernel md2 for h1"

  - interval: 1m
    name: RaidDegraded stays silent on a healthy array
    input_series:
      - series: 'node_md_disks{device="md2",state="active",instance="h1",job="node-exporter"}'
        values: '2x5'
      - series: 'node_md_disks{device="md2",state="failed",instance="h1",job="node-exporter"}'
        values: '0x5'
      - series: 'node_md_disks_required{device="md2",instance="h1",job="node-exporter"}'
        values: '2x5'
    alert_rule_test:
      - alertname: RaidDegraded
        eval_time: 3m
        exp_alerts: []

  # CPUwaitIO reads instance_mode:node_cpu_seconds:rate1m, which does
  # sum without (cpu) -- the raw value is iowait-seconds per second summed over
  # every core, not a ratio. Dividing by instance:node_cpus:count makes the 10%
  # threshold mean the same thing on a 1-vCPU box and a 64-core one.
  #
  # Note the 15s sample interval: the record does rate(...[1m]), which needs at
  # least two points in the range.
  # 4 cores, iowait +3 per 15s sample = 0.2 core-seconds/s each.
  # 0.8 total over 4 cores = 20%, above the 10% threshold.
  - interval: 15s
    input_series:
      - series: 'node_cpu_seconds_total{mode="iowait",cpu="0",instance="h1",job="node-exporter"}'
        values: '0+3x160'
      - series: 'node_cpu_seconds_total{mode="iowait",cpu="1",instance="h1",job="node-exporter"}'
        values: '0+3x160'
      - series: 'node_cpu_seconds_total{mode="iowait",cpu="2",instance="h1",job="node-exporter"}'
        values: '0+3x160'
      - series: 'node_cpu_seconds_total{mode="iowait",cpu="3",instance="h1",job="node-exporter"}'
        values: '0+3x160'
      - series: 'node_cpu_seconds_total{mode="idle",cpu="0",instance="h1",job="node-exporter"}'
        values: '0+12x160'
      - series: 'node_cpu_seconds_total{mode="idle",cpu="1",instance="h1",job="node-exporter"}'
        values: '0+12x160'
      - series: 'node_cpu_seconds_total{mode="idle",cpu="2",instance="h1",job="node-exporter"}'
        values: '0+12x160'
      - series: 'node_cpu_seconds_total{mode="idle",cpu="3",instance="h1",job="node-exporter"}'
        values: '0+12x160'
    alert_rule_test:
      - alertname: CPUwaitIO
        eval_time: 20m
        exp_alerts:
          - exp_labels: {alertname: CPUwaitIO, instance: h1, job: node-exporter, severity: critical}
            exp_annotations:
              summary: "High IOWait (20%) on h1"
              description: "CPU time spent waiting on I/O is above 10% on h1 — check disk latency and saturation"

  # NodeSystemdNotRunning is opt-in: 45% of the live fleet reports systemd
  # degraded while no failed unit is visible through node_systemd_unit_state,
  # so an opt-out form paged on 239 hosts with nothing actionable in the page.
  - interval: 1m
    name: a degraded host without the opt-in label stays silent
    input_series:
      - series: 'node_systemd_system_running{instance="h1",job="node-exporter"}'
        values: '0x30'
    alert_rule_test:
      - alertname: NodeSystemdNotRunning
        eval_time: 20m
        exp_alerts: []

  - interval: 1m
    name: a degraded host that opted in does alert
    input_series:
      - series: 'node_systemd_system_running{instance="h2",job="node-exporter",alertSystemdDegraded="yes"}'
        values: '0x30'
    alert_rule_test:
      - alertname: NodeSystemdNotRunning
        eval_time: 20m
        exp_alerts:
          - exp_labels:
              alertname: NodeSystemdNotRunning
              instance: h2
              job: node-exporter
              alertSystemdDegraded: "yes"
              severity: warning
            exp_annotations:
              summary: "systemd not fully operational on h2"
              description: "systemd reports system is not fully operational on h2."
