<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prometheus Rules</title>
<link rel="preload" href="rules.json" as="fetch" crossorigin>
<style>
:root{
  --bg:#f8f7f4;--panel:#fff;--sunken:#f0eee9;--line:#e6e3dc;--text:#1c1b19;--muted:#5d5a54;--faint:#98948c;
  --accent:#d9480f;--accent-soft:#fdeadf;
  --crit:#c9302c;--crit-soft:#fbe3e1;--warn:#a96a12;--warn-soft:#fbefd6;--rec:#4f46e5;--rec-soft:#e8e7fd;
  --code-bg:#f5f3ee;--t-fn:#7c3aed;--t-kw:#c2410c;--t-num:#0f766e;--t-str:#15803d;--t-metric:#1d4ed8;--t-label:#9a3412;--t-op:#8a867e;
  --flash:#fff1c2;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0e0f11;--panel:#15161a;--sunken:#1d1e23;--line:#2a2b31;--text:#ebe8e2;--muted:#aaa59c;--faint:#6f6c66;
  --accent:#ff7a45;--accent-soft:#3a1f14;
  --crit:#ff6b63;--crit-soft:#3b1715;--warn:#f2b84b;--warn-soft:#352812;--rec:#a5b4fc;--rec-soft:#1f2140;
  --code-bg:#111216;--t-fn:#c4a7ff;--t-kw:#ff9e64;--t-num:#5eead4;--t-str:#86efac;--t-metric:#93c5fd;--t-label:#fdba74;--t-op:#7d7a73;
  --flash:#3a3014;
  color-scheme:dark;
}}
:root[data-theme=dark]{
  --bg:#0e0f11;--panel:#15161a;--sunken:#1d1e23;--line:#2a2b31;--text:#ebe8e2;--muted:#aaa59c;--faint:#6f6c66;
  --accent:#ff7a45;--accent-soft:#3a1f14;
  --crit:#ff6b63;--crit-soft:#3b1715;--warn:#f2b84b;--warn-soft:#352812;--rec:#a5b4fc;--rec-soft:#1f2140;
  --code-bg:#111216;--t-fn:#c4a7ff;--t-kw:#ff9e64;--t-num:#5eead4;--t-str:#86efac;--t-metric:#93c5fd;--t-label:#fdba74;--t-op:#7d7a73;
  --flash:#3a3014;
  color-scheme:dark;
}
*{box-sizing:border-box}
/* --top-h tracks the sticky header height (ResizeObserver): it wraps differently per width. */
html{scroll-padding-top:calc(var(--top-h,105px) + 15px)}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
code,pre,.mono{font-family:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace}
a{color:inherit}
button{font:inherit;color:inherit}
kbd{font:11px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 5px;color:var(--muted);background:var(--panel)}
[hidden]{display:none!important}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.row1{display:flex;align-items:center;gap:14px;padding:10px 24px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:-.01em;white-space:nowrap;text-decoration:none}
.logo{width:26px;height:26px;border-radius:7px;background:var(--accent);display:grid;place-items:center;color:#fff}
.search{flex:1;max-width:640px;margin:0 auto;position:relative}
.search input{width:100%;height:38px;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:0 40px 0 36px;font:inherit;font-size:14.5px;color:var(--text);outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:12px;top:11px;color:var(--faint)}
.search input{padding-right:118px}
.palhint{position:absolute;right:5px;top:5px;height:28px;display:inline-flex;align-items:center;gap:6px;border:0;border-radius:7px;background:var(--sunken);color:var(--muted);font-size:12.5px;padding:0 6px 0 9px;cursor:pointer}
.palhint:hover{color:var(--accent)}
.iconbtn{width:36px;height:36px;border:1px solid var(--line);background:var(--panel);border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--muted);text-decoration:none;flex:none}
.iconbtn:hover{color:var(--text)}
.row2{display:flex;align-items:center;gap:10px;padding:0 24px 10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--sunken);padding:3px;border-radius:9px;gap:2px}
.seg button{border:0;background:none;padding:4px 11px;border-radius:7px;font-size:13px;font-weight:550;color:var(--muted);cursor:pointer;display:inline-flex;gap:6px;align-items:center;white-space:nowrap;font-variant-numeric:tabular-nums}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgb(0 0 0/.08)}
.seg .n{color:var(--faint);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.critical{background:var(--crit)}.dot.warning{background:var(--warn)}.dot.record{background:var(--rec);border-radius:2px}
.count{margin-left:auto;font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.link{font-size:13px;font-weight:550;color:var(--muted);text-decoration:none;padding:4px 8px;border-radius:7px}
.link:hover,.link.on{color:var(--accent)}
.gsel{display:none;height:30px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);padding:0 8px;font:inherit;font-size:13px;max-width:180px}

/* layout */
.layout{display:grid;grid-template-columns:220px minmax(0,1fr);max-width:1440px;margin:0 auto}
.toc{position:sticky;top:var(--top-h,105px);align-self:start;height:calc(100vh - var(--top-h,105px));overflow:auto;padding:18px 10px 40px 18px;overscroll-behavior:contain}
.toc a{display:flex;justify-content:space-between;gap:8px;padding:4px 10px;border-radius:7px;font-size:13.5px;color:var(--muted);text-decoration:none;border-left:2px solid transparent}
.toc a:hover{color:var(--text);background:var(--sunken)}
.toc a.on{color:var(--text);font-weight:600;border-left-color:var(--accent);border-radius:0 7px 7px 0;background:var(--sunken)}
.toc .c{font-variant-numeric:tabular-nums;color:var(--faint);font-weight:500;display:inline-flex;gap:6px;align-items:center}
.toch{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:2px 0 8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:650}
.toch em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500}
.toch button{border:0;background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 7px;font-size:11.5px;text-transform:none;letter-spacing:0;cursor:pointer}
.toc a.pick{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tocc{display:block;width:100%;text-align:left;border:0;background:none;margin:16px 0 4px;padding:2px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:650;cursor:pointer}
.tocc:hover,.tocc.pick{color:var(--accent)}
.gcat{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:650}
.badge.issue{background:transparent;border:1px dashed var(--line);color:var(--faint);font-weight:500;cursor:help}
.toc a.pick .c{color:inherit}
.doc{padding:8px 32px 120px;min-width:0}

/* groups */
.grp{margin-top:22px}
.gh{position:sticky;top:var(--top-h,105px);z-index:5;background:var(--bg);display:flex;align-items:baseline;gap:12px;padding:12px 2px 10px;border-bottom:1px solid var(--line);margin-bottom:10px}
.gh h2{margin:0;font-size:19px;letter-spacing:-.015em;font-weight:700}
.gh .meta{font-size:12.5px;color:var(--faint);display:flex;gap:12px;align-items:center;font-variant-numeric:tabular-nums}
.gh .meta a{text-decoration:none;color:var(--muted)}
.gh .meta a:hover{color:var(--accent)}
.gh .files{margin-left:auto}

/* rules */
/* content-visibility: offscreen rules skip style and layout, the bulk of the boot cost with 500+ rules. */
.rule{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:8px;position:relative;overflow:hidden;scroll-margin-top:calc(var(--top-h,105px) + 65px);content-visibility:auto;contain-intrinsic-size:auto 200px}
.rule::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px}
.rule.critical::before{background:var(--crit)}.rule.warning::before{background:var(--warn)}.rule.record::before{background:var(--rec)}
.rule.focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rule.flash{animation:flash 1.6s ease}
@keyframes flash{0%,30%{background:var(--flash)}}
.rh{display:flex;align-items:center;gap:10px;padding:12px 16px 0 19px;flex-wrap:wrap}
.rn{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:14.5px;font-weight:650;text-decoration:none;word-break:break-word}
.rn:hover{color:var(--accent)}
.badge{font-size:11.5px;font-weight:600;border-radius:6px;padding:1px 7px;background:var(--sunken);color:var(--muted);white-space:nowrap;text-decoration:none;font-variant-numeric:tabular-nums}
.badge.critical{background:var(--crit-soft);color:var(--crit)}.badge.warning{background:var(--warn-soft);color:var(--warn)}.badge.record{background:var(--rec-soft);color:var(--rec)}
a.badge:hover{color:var(--accent)}
.acts{margin-left:auto;display:flex;gap:4px;opacity:.55;transition:opacity .15s}
.rule:hover .acts,.rule.focus .acts{opacity:1}
.act{border:1px solid var(--line);background:var(--panel);border-radius:6px;font-size:11.5px;padding:2px 8px;color:var(--muted);cursor:pointer}
.act:hover{color:var(--text)}.act.ok{color:var(--t-str);border-color:var(--t-str)}
.rb{padding:6px 16px 14px 19px}
.sum{margin:0;font-size:15px;font-weight:550;text-wrap:pretty}
.desc{margin:2px 0 0;color:var(--muted);font-size:14px;text-wrap:pretty}
.ph{font-family:ui-monospace,Menlo,monospace;font-size:.8em;background:var(--sunken);border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--t-label);white-space:nowrap}
.ph.val{color:var(--t-num)}
pre.expr{margin:10px 0 0;background:var(--code-bg);border:1px solid var(--line);border-radius:9px;padding:10px 14px;overflow:auto;font-size:12.8px;line-height:1.6;white-space:pre-wrap;word-break:break-word;max-height:360px}
.t-fn{color:var(--t-fn)}.t-kw{color:var(--t-kw);font-weight:600}.t-num{color:var(--t-num)}.t-str{color:var(--t-str)}.t-metric{color:var(--t-metric)}.t-label{color:var(--t-label)}.t-op{color:var(--t-op)}.t-com{color:var(--faint);font-style:italic}
a.t-metric{text-decoration:none;border-bottom:1px dotted currentColor;cursor:pointer}
a.t-metric:hover{border-bottom-style:solid}
.used{margin-top:8px;font-size:12.5px;color:var(--faint);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.used a{font-family:ui-monospace,Menlo,monospace;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:0 6px;display:inline-flex;gap:5px;align-items:center}
.used a:hover{color:var(--text);border-color:var(--accent)}

/* compact mode: one line per rule, expand on click */
body.compact .rule{border-radius:0;margin:0;border-width:0 0 1px;background:transparent;cursor:pointer;overflow:visible;contain-intrinsic-size:auto 36px}
body.compact .grp .rule:first-of-type{border-top-width:0}
body.compact .rh{padding:7px 12px 7px 16px;flex-wrap:nowrap}
body.compact .rn{font-size:13.5px;flex:none;max-width:42%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.compact .csum{display:block}
body.compact .rb{display:none}
body.compact .rule.open{background:var(--panel);cursor:default}
body.compact .rule.open .rb{display:block}
body.compact .rule.open .csum{visibility:hidden}
body.compact .rule:hover{background:var(--panel)}
.csum{display:none;flex:1;min-width:0;font-size:13.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
body.compact .acts{display:none}
body.compact .rule.open .acts{display:flex}

.empty{padding:80px 20px;text-align:center;color:var(--faint)}
.loading{padding:120px;text-align:center;color:var(--faint)}

/* metric drawer */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--panel);border-left:1px solid var(--line);z-index:50;transform:translateX(100%);transition:transform .22s ease;overflow:auto;box-shadow:-20px 0 40px rgb(0 0 0/.12);visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.dw{padding:22px 24px 48px}
.dw h3{font-family:ui-monospace,Menlo,monospace;font-size:16px;margin:8px 0 6px;word-break:break-all}
.dw .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:650;margin:22px 0 8px}
.dw p{margin:0;color:var(--muted)}
.dw pre{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:12px;white-space:pre-wrap;word-break:break-all}
.lbls{display:flex;flex-wrap:wrap;gap:4px}
.lbls code{font-size:12px;background:var(--sunken);border-radius:4px;padding:1px 6px;color:var(--t-label)}
.rl a{display:flex;gap:8px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;text-decoration:none;font-family:ui-monospace,Menlo,monospace;font-size:12.8px}
.rl a:hover{border-color:var(--accent)}
.rl a span.g{margin-left:auto;color:var(--faint);font-family:ui-sans-serif,system-ui;font-size:12px}
.close{float:right}

/* coverage */
.cov{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;margin-top:22px}
.cv{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.cv h4{margin:0;font-family:ui-monospace,Menlo,monospace;font-size:14px;display:flex;justify-content:space-between}
.cv .pct{font-variant-numeric:tabular-nums;color:var(--muted)}
.bar{height:5px;background:var(--sunken);border-radius:3px;overflow:hidden;margin:10px 0 8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.cv .sub{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.cv details{margin-top:8px}
.cv summary{font-size:12.5px;color:var(--muted);cursor:pointer}
.cv ul{list-style:none;margin:8px 0 0;padding:0;max-height:260px;overflow:auto}
.cv li a{display:block;font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:2px 0;color:var(--muted);text-decoration:none;word-break:break-all}
.cv li a:hover{color:var(--accent)}
.covh{display:flex;align-items:baseline;gap:12px;padding-top:18px}
.covh h2{margin:0;font-size:22px;letter-spacing:-.02em}
.covh p{margin:0;color:var(--faint);font-size:13.5px}

/* command palette */
.kbtn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:3px 6px 3px 10px;font-size:13px;color:var(--muted);cursor:pointer}
.kbtn:hover{color:var(--text);border-color:var(--accent)}
.pal{position:fixed;inset:0;z-index:60;background:rgb(0 0 0/.35);display:flex;justify-content:center;align-items:flex-start;padding:12vh 16px 16px}
.palbox{width:min(640px,100%);background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px rgb(0 0 0/.3);overflow:hidden;display:flex;flex-direction:column;max-height:70vh}
.palin{display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line)}
.palin svg{color:var(--faint);flex:none}
.palin input{flex:1;height:52px;border:0;background:none;font:inherit;font-size:16px;color:var(--text);outline:none}
.palres{overflow:auto;padding:6px}
.palsec{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:650;padding:10px 10px 4px}
.palit{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;min-width:0}
.palit.on{background:var(--sunken)}
.palit .pl{font-weight:600;white-space:nowrap}
.palit .pl.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
.palit .ps{color:var(--faint);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.palit .pk{margin-left:auto;font-size:11.5px;color:var(--faint);white-space:nowrap}
.palit.on .pk::after{content:" ↵"}
.palit.picked .pl{color:var(--accent)}
.palit b{color:var(--accent);font-weight:inherit}
.ico{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:none;font-size:11px;font-weight:700;background:var(--sunken);color:var(--muted)}
.ico.p{background:var(--accent-soft);color:var(--accent)}
.palfoot{border-top:1px solid var(--line);padding:8px 14px;font-size:12px;color:var(--faint);display:flex;gap:14px;flex-wrap:wrap}
.palempty{padding:28px;text-align:center;color:var(--faint)}

@media (max-width:1000px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .gh{flex-wrap:wrap}
  .gh .files{display:none}
  .toc{display:none}
  .gsel{display:inline-block}
  .doc{padding:8px 16px 100px}
}
@media (max-width:640px){
  .row1{padding:10px 16px;gap:10px;flex-wrap:wrap}
  .search{order:3;flex-basis:100%}
  .palhint kbd{display:none}
  /* One scrollable row of filters: wrapped, they made the sticky header a third of the screen. */
  .row2{padding:0 16px 10px;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .row2>*{flex:none}
  .top{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg)}
  .seg .n{display:none}
  .count{display:none}
  body.compact .rn{max-width:60%}
}
@media (hover:none){.acts{opacity:1}}
@media (pointer:coarse){
  .iconbtn{width:44px;height:44px}
  .search input{height:44px}
  .palhint{top:6px;height:32px}
  .seg button,.link,.gsel{min-height:40px}
  .act{min-height:36px;padding:2px 12px;display:inline-flex;align-items:center}
  body.compact .rh{min-height:44px}
}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}.rule.flash{animation:none}}
</style>
</head>
<body>
<header class="top">
  <div class="row1">
    <a class="brand" href="#/">
      <span class="logo"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></span>
      Prometheus Rules
    </a>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Filtrer : nom, summary, métrique, PromQL…" autocomplete="off" spellcheck="false">
      <button class="palhint" id="palbtn" type="button" title="Aller à un produit, une alerte, une métrique">Aller à… <kbd id="palkbd">⌘K</kbd></button>
    </div>
    <button class="iconbtn" id="theme" title="Thème"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
    <a class="iconbtn" id="gh" title="GitHub" target="_blank" rel="noopener"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-6 0-1.2.5-2.3 1.2-3.1-.1-.4-.5-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0C17.3 4.7 18.3 5 18.3 5c.7 1.6.3 2.8.1 3.2.8.8 1.2 1.9 1.2 3.1 0 4.7-2.8 5.7-5.5 6 .4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .5Z"/></svg></a>
  </div>
  <div class="row2">
    <select class="gsel" id="gsel"></select>
    <div class="seg" id="segKind">
      <button data-kind="alert">Alertes<span class="n"></span></button>
      <button data-kind="record">Records<span class="n"></span></button>
      <button data-kind="all">Tout<span class="n"></span></button>
    </div>
    <div class="seg" id="segSev">
      <button data-sev="all">Toutes<span class="n"></span></button>
      <button data-sev="critical"><span class="dot critical"></span>Critical<span class="n"></span></button>
      <button data-sev="warning"><span class="dot warning"></span>Warning<span class="n"></span></button>
    </div>
    <div class="seg" id="segDensity">
      <button data-density="full" title="Tout déplié">Détaillé</button>
      <button data-density="compact" title="Une ligne par règle">Compact</button>
    </div>
    <div class="seg"><button data-review title="Pas de for, description manquante ou identique au summary, recording rule sans consommateur">À revoir<span class="n"></span></button></div>
    <a class="link" id="covLink" href="#/coverage">Couverture</a>
    <span class="count" id="count"></span>
  </div>
</header>

<div class="layout">
  <nav class="toc" id="toc"></nav>
  <main class="doc" id="doc"><div class="loading">Chargement…</div></main>
</div>
<aside class="drawer" id="drawer" aria-label="Métrique"></aside>
<div class="pal" id="pal" hidden>
  <div class="palbox" role="dialog" aria-label="Recherche rapide">
    <div class="palin">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="palq" placeholder="Produit, alerte, recording rule, métrique…" autocomplete="off" spellcheck="false">
      <kbd>esc</kbd>
    </div>
    <div class="palres" id="palres"></div>
    <div class="palfoot"><span><kbd>↑</kbd> <kbd>↓</kbd> naviguer</span><span><kbd>↵</kbd> ouvrir</span><span><kbd id="palmod">⌘</kbd> <kbd>↵</kbd> ajouter au filtre</span><span><kbd>p:</kbd> <kbd>a:</kbd> <kbd>r:</kbd> <kbd>m:</kbd> produits, alertes, records, métriques</span></div>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const ESC = {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC[c]);
const enc = encodeURIComponent;

const S = { q:'', sev:'all', kind:'alert', density:'full', view:'rules', products:new Set(), review:false };
try { S.density = localStorage.getItem('density') || 'full'; } catch {}
let RULES = [], GROUPS = [], EXP = [], REPO = '';
const CAT_ORDER = ['Hosts & hardware', 'Kubernetes', 'Databases', 'Messaging & streaming', 'Web & load balancing', 'Network, DNS & TLS', 'Observability', 'Other'];
const CATS = new Map();
const METRIC = new Map(), USES = new Map(), RECNAME = new Map(), BYID = new Map();

const lookup = m => METRIC.get(m) || METRIC.get(m.replace(/_(bucket|sum|count)$/, ''));
const keyOf = m => lookup(m)?.name || m;

/* ---------- data ---------- */
async function boot() {
  const d = await (await fetch('rules.json')).json();
  REPO = d.meta?.github_repo || '';
  $('#gh').href = REPO;
  for (const [name, [type, help, exporter]] of Object.entries(d.metrics || {})) METRIC.set(name, { name, type, help, exporter });
  METRIC.set('up', { name:'up', type:'gauge', help:'1 si la cible a répondu au dernier scrape, 0 sinon. Série synthétique produite par Prometheus.', labels:['instance','job'], exporter:null });

  const gmap = new Map();
  for (const f of d.rules) {
    const g = f.name.replace(/\.(rules|records)$/, '');
    if (!gmap.has(g)) gmap.set(g, { name: g, cat: f.category || 'Other', files: [], rules: [] });
    const G = gmap.get(g);
    G.files.push({ file: f.file, url: f.github_url });
    for (const r of f.rules) {
      const name = r.alert || r.record;
      const o = { ...r, name, group: g, file: f.file, url: f.github_url, src: f.github_url + (r.line ? '#L' + r.line : ''), id: g + '/' + name, sevk: r.kind === 'alert' ? r.severity : 'record' };
      // Same alert name can appear twice in a group (split selectors): suffix to keep DOM ids unique.
      for (let n = 2; BYID.has(o.id); n++) o.id = g + '/' + name + '~' + n;
      G.rules.push(o); RULES.push(o); BYID.set(o.id, o);
    }
  }
  const ci = c => { const i = CAT_ORDER.indexOf(c); return i < 0 ? CAT_ORDER.length : i; };
  GROUPS = [...gmap.values()].sort((a, b) => ci(a.cat) - ci(b.cat) || a.name.localeCompare(b.name));
  for (const G of GROUPS) { if (!CATS.has(G.cat)) CATS.set(G.cat, []); CATS.get(G.cat).push(G); }
  for (const G of GROUPS) G.rules.sort((a, b) => (a.kind === b.kind ? 0 : a.kind === 'alert' ? -1 : 1));
  for (const r of RULES) if (r.kind === 'record') RECNAME.set(r.record, r);
  for (const r of RULES) {
    r.refs = [...new Set((r.metric_refs || []).filter(m => lookup(m) || RECNAME.has(m)))];
    for (const m of r.refs) { const k = keyOf(m); if (!USES.has(k)) USES.set(k, []); USES.get(k).push(r); }
    r.hay = [r.name, r.group, r.summary, r.description, r.expr, r.severity, r.for].join(' ').toLowerCase();
  }
  for (const r of RULES) {
    const iss = r.issues = [];
    if (r.kind === 'alert') {
      if (!r.for) iss.push(['pas de for', 'Se déclenche dès la première évaluation : un seul scrape raté suffit.']);
      if (!r.description) iss.push(['pas de description', 'Seul le summary arrive dans la notification.']);
      else if (r.description === r.summary) iss.push(['description = summary', 'La description répète le summary au lieu de donner le contexte.']);
    } else if (!(USES.get(r.record) || []).length) iss.push(['aucun consommateur', 'Aucune alerte ni recording rule ne lit cette série.']);
  }

  renderControls();
  renderDoc();
  route();
  // exporters.json (~1.5 MB) only feeds the metric drawer and the coverage page: prefetch it on the
  // first interaction, never at boot, where it competed with the first paint on slow mobile links.
  const pre = () => { for (const ev of PREFETCH_ON) removeEventListener(ev, pre); loadExporters(); };
  for (const ev of PREFETCH_ON) addEventListener(ev, pre, { passive: true });
}
const PREFETCH_ON = ['pointermove', 'touchstart', 'keydown', 'scroll'];
let EXP_P = null;
function loadExporters() {
  return EXP_P ||= fetch('exporters.json').then(r => r.json()).then(d => {
    for (const e of d.exporters) for (const m of e.metrics) {
      const cur = METRIC.get(m.name);
      if (!cur || (!cur.full && cur.exporter === e.name)) METRIC.set(m.name, { ...m, exporter: e.name, full: true });
    }
    EXP = d.exporters.map(e => {
      const biz = e.metrics.filter(m => !m.generic);
      const unc = biz.filter(m => !USES.has(m.name));
      const al = new Set();
      for (const m of e.metrics) for (const r of USES.get(m.name) || []) if (r.kind === 'alert') al.add(r.id);
      return { name: e.name, url: e.github_url, biz: biz.length, unc, alerts: al.size };
    }).sort((a, b) => (b.biz - b.unc.length) / (b.biz || 1) - (a.biz - a.unc.length) / (a.biz || 1));
  });
}

/* ---------- formatting ---------- */
function tpl(s) {
  return esc(s).replace(/\{\{-?\s*(.*?)\s*-?\}\}/g, (_, x) => {
    const m = x.match(/^\$labels\.(\w+)/);
    if (m) return `<span class="ph">${m[1]}</span>`;
    if (x.includes('$value')) { const f = x.split('|')[1]; return `<span class="ph val">valeur${f ? ' · ' + f.trim() : ''}</span>`; }
    return `<span class="ph">${x}</span>`;
  });
}
const plain = s => String(s ?? '').replace(/\{\{-?\s*\$labels\.(\w+)\s*-?\}\}/g, '$1').replace(/\{\{.*?\}\}/g, 'valeur');
const FN = new Set('abs absent absent_over_time avg avg_over_time bottomk ceil changes clamp clamp_max clamp_min count count_over_time count_values day_of_month day_of_week days_in_month delta deriv exp floor group histogram_quantile holt_winters hour idelta increase irate label_join label_replace last_over_time ln log10 log2 max max_over_time min min_over_time minute month predict_linear quantile quantile_over_time rate resets round scalar sgn sort sort_desc sqrt stddev stddev_over_time stdvar stdvar_over_time sum sum_over_time time timestamp topk vector year present_over_time limitk'.split(' '));
const KW = new Set('by without on ignoring group_left group_right and or unless offset bool'.split(' '));
const LBLKW = new Set('by without on ignoring group_left group_right'.split(' '));
function promql(src) {
  const re = /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`[^`]*`)|(#[^\n]*)|(\d+(?:\.\d+)?(?:ms|[smhdwy])(?:\d+(?:ms|[smhdwy]))*\b|\d+(?:\.\d+)?(?:e[+-]?\d+)?)|([a-zA-Z_:][\w:]*)|(=~|!~|!=|==|>=|<=|[-+*/%^<>=])|([{}()[\],])|(\s+|.)/g;
  let out = '', m, brace = 0, paren = 0, pending = false, lblParen = -1;
  while ((m = re.exec(src))) {
    const [t, str, com, num, id, op, p] = m;
    if (str) out += `<span class="t-str">${esc(t)}</span>`;
    else if (com) out += `<span class="t-com">${esc(t)}</span>`;
    else if (num) out += `<span class="t-num">${t}</span>`;
    else if (id) {
      if (brace > 0 || lblParen >= 0) out += `<span class="t-label">${t}</span>`;
      else if (KW.has(id)) { out += `<span class="t-kw">${t}</span>`; if (LBLKW.has(id)) pending = true; }
      else if (FN.has(id) && /^\s*\(/.test(src.slice(re.lastIndex))) out += `<span class="t-fn">${t}</span>`;
      else if (RECNAME.has(id)) out += `<a class="t-metric" href="#/r/${enc(RECNAME.get(id).id)}">${t}</a>`;
      else if (lookup(id)) out += `<a class="t-metric" href="#/m/${enc(keyOf(id))}">${t}</a>`;
      else out += `<span class="t-metric">${t}</span>`;
    }
    else if (op) out += `<span class="t-op">${esc(t)}</span>`;
    else if (p) {
      if (p === '{') brace++; else if (p === '}') brace = Math.max(0, brace - 1);
      else if (p === '(') { paren++; if (pending) { lblParen = paren; pending = false; } }
      else if (p === ')') { if (paren === lblParen) lblParen = -1; paren--; }
      out += `<span class="t-op">${t}</span>`;
    }
    else out += esc(t);
  }
  return out;
}
function yaml(r) {
  const ind = s => s.trimEnd().split('\n').map(l => '    ' + l).join('\n');
  if (r.kind === 'record') return `- record: ${r.record}\n  expr: |\n${ind(r.expr)}\n`;
  let y = `- alert: ${r.alert}\n  expr: |\n${ind(r.expr)}\n`;
  if (r.for) y += `  for: ${r.for}\n`;
  y += `  labels:\n    severity: ${r.severity}\n  annotations:\n`;
  for (const k of ['summary', 'description', 'runbook_url']) if (r[k]) y += `    ${k}: ${JSON.stringify(r[k])}\n`;
  return y;
}
const ruleLink = o => `<a href="#/r/${enc(o.id)}"><span class="dot ${o.sevk}"></span>${esc(o.name)}</a>`;

/* ---------- render (once) ---------- */
function ruleHTML(r) {
  const isA = r.kind === 'alert';
  const consumers = isA ? [] : (USES.get(r.record) || []);
  return `<article class="rule ${r.sevk}" id="${esc(r.id)}" data-id="${esc(r.id)}">
    <div class="rh">
      <span class="dot ${r.sevk}"></span>
      <a class="rn" href="#/r/${enc(r.id)}">${esc(r.name)}</a>
      ${isA ? `<span class="badge ${r.severity}">${r.severity}</span>` : '<span class="badge record">record</span>'}
      ${r.for ? `<span class="badge">for ${esc(r.for)}</span>` : ''}
      ${r.runbook_url ? `<a class="badge" href="${esc(r.runbook_url)}" target="_blank" rel="noopener">runbook ↗</a>` : ''}
      ${r.issues.map(([l, why]) => `<span class="badge issue" title="${esc(why)}">${esc(l)}</span>`).join('')}
      <span class="csum">${esc(plain(isA ? r.summary : r.expr.replace(/\s+/g, ' ')))}</span>
      <span class="acts">
        <button class="act" data-copy="expr">PromQL</button>
        <button class="act" data-copy="yaml">YAML</button>
        <button class="act" data-copy="link">Lien</button>
        <a class="act" href="${esc(r.src)}" target="_blank" rel="noopener" title="${esc(r.file)}${r.line ? ':' + r.line : ''}">Source ↗</a>
      </span>
    </div>
    <div class="rb">
      ${isA ? `<p class="sum">${tpl(r.summary)}</p>${r.description && r.description !== r.summary ? `<p class="desc">${tpl(r.description)}</p>` : ''}` : ''}
      <pre class="expr">${esc(r.expr.trim())}</pre>
      ${!isA ? `<div class="used">${consumers.length ? `Utilisée par ${consumers.map(ruleLink).join('')}` : 'Aucune règle ne la consomme.'}</div>` : ''}
    </div>
  </article>`;
}
function renderDoc() {
  $('#doc').innerHTML = GROUPS.map(G => `<section class="grp" id="g-${esc(G.name)}" data-g="${esc(G.name)}">
      <header class="gh"><h2>${esc(G.name)}</h2><span class="gcat">${esc(G.cat)}</span><span class="meta" data-meta></span>
        <span class="meta files">${G.files.map(f => `<a href="${esc(f.url)}" target="_blank" rel="noopener">${esc(f.file)} ↗</a>`).join('')}</span></header>
      ${G.rules.map(ruleHTML).join('')}
    </section>`).join('') +
    `<div class="empty" id="empty" hidden></div><section id="coverage" hidden></section>`;
  for (const G of GROUPS) {
    G.el = document.getElementById('g-' + G.name);
    G.meta = G.el.querySelector('[data-meta]');
    for (const r of G.rules) r.el = document.getElementById(r.id);
  }
  observe();
  // PromQL is highlighted only near the viewport: done eagerly it was ~10k spans at boot.
  const hl = new IntersectionObserver(es => {
    for (const e of es) if (e.isIntersecting) {
      hl.unobserve(e.target);
      const r = BYID.get(e.target.dataset.id);
      e.target.querySelector('pre.expr').innerHTML = promql(r.expr.trim());
    }
  }, { rootMargin: '600px 0px' });
  for (const r of RULES) hl.observe(r.el);
}

/* ---------- filtering (toggle visibility only) ---------- */
const inProduct = r => !S.products.size || S.products.has(r.group);
let termsQ = '', TERMS = [];
const matchQ = r => {
  if (termsQ !== S.q) { termsQ = S.q; TERMS = S.q ? S.q.split(/\s+/) : []; }
  return TERMS.every(t => r.hay.includes(t));
};
const visible = r => inProduct(r) && (S.kind === 'all' || r.kind === S.kind) && (!S.review || r.issues.length) &&
  (S.sev === 'all' || r.kind !== 'alert' || r.severity === S.sev) && matchQ(r);
function applyFilter() {
  let total = 0;
  const sevBase = { all: 0, critical: 0, warning: 0 };
  for (const G of GROUPS) {
    let n = 0, a = 0, c = 0, rec = 0, nAll = 0, cAll = 0;
    for (const r of G.rules) {
      const v = visible(r);
      r.el.hidden = !v;
      if (v) { n++; if (r.kind === 'alert') { a++; if (r.severity === 'critical') c++; } else rec++; }
      const base = (S.kind === 'all' || r.kind === S.kind) && (!S.review || r.issues.length) && matchQ(r);
      if (base && (S.sev === 'all' || r.kind !== 'alert' || r.severity === S.sev)) { nAll++; if (r.severity === 'critical') cAll++; }
      if (base && inProduct(r) && r.kind === 'alert') { sevBase.all++; sevBase[r.severity]++; }
    }
    G.n = n; G.c = c; G.nAll = nAll; G.cAll = cAll;
    G.el.hidden = !n || S.view !== 'rules';
    G.meta.innerHTML = [a && `${a} alerte${a > 1 ? 's' : ''}`, c && `<span style="color:var(--crit)">${c} critical</span>`, rec && `${rec} record${rec > 1 ? 's' : ''}`].filter(Boolean).join(' · ');
    total += n;
  }
  $('#count').textContent = S.view === 'rules' ? `${total} règle${total > 1 ? 's' : ''}` : '';
  const empty = $('#empty');
  empty.hidden = !!total || S.view !== 'rules';
  empty.textContent = `Aucune règle ne correspond à « ${S.q} ».`;
  for (const [k, n] of Object.entries(sevBase)) { const el = $(`#segSev [data-sev="${k}"] .n`); if (el) el.textContent = n; }
  $('#segSev').style.visibility = S.kind === 'record' ? 'hidden' : '';
  renderToc();
}
function renderToc() {
  const gs = GROUPS.filter(G => G.nAll || S.products.has(G.name));
  const sel = S.products.size;
  const byCat = [...CATS].map(([cat, all]) => [cat, all.filter(G => gs.includes(G))]).filter(([, xs]) => xs.length);
  $('#toc').innerHTML = `<div class="toch"><span>Produits</span>${sel ? `<button data-pall>Tous · ${sel} sélectionné${sel > 1 ? 's' : ''} ✕</button>` : '<em>⌘-clic : plusieurs</em>'}</div>` +
    byCat.map(([cat, xs]) => `<button class="tocc ${CATS.get(cat).every(G => S.products.has(G.name)) ? 'pick' : ''}" data-cat="${esc(cat)}" title="Filtrer la catégorie">${esc(cat)}</button>` +
      xs.map(G => `<a href="#/g/${enc(G.name)}" data-toc="${esc(G.name)}" class="${S.products.has(G.name) ? 'pick' : ''}">${esc(G.name)}<span class="c">${G.cAll ? `<span class="dot critical" title="${G.cAll} critical"></span>` : ''}${G.nAll}</span></a>`).join('')).join('');
  $('#gsel').innerHTML = `<option value="">Tous les produits</option>` + byCat.map(([cat, xs]) => `<optgroup label="${esc(cat)}">` +
    xs.map(G => `<option value="${esc(G.name)}" ${sel === 1 && S.products.has(G.name) ? 'selected' : ''}>${esc(G.name)} (${G.nAll})</option>`).join('') + '</optgroup>').join('');
  markToc(current);
}
// Buttons are static HTML so the header keeps its height when data arrives (no layout shift).
function renderControls() {
  const na = RULES.filter(r => r.kind === 'alert').length;
  for (const [k, n] of [['alert', na], ['record', RULES.length - na], ['all', RULES.length]]) $(`#segKind [data-kind="${k}"] .n`).textContent = n;
  syncControls();
}
function syncControls() {
  for (const b of document.querySelectorAll('[data-kind]')) b.setAttribute('aria-pressed', b.dataset.kind === S.kind);
  for (const b of document.querySelectorAll('[data-sev]')) b.setAttribute('aria-pressed', b.dataset.sev === S.sev);
  for (const b of document.querySelectorAll('[data-density]')) b.setAttribute('aria-pressed', b.dataset.density === S.density);
  $('[data-review]').setAttribute('aria-pressed', S.review);
  $('[data-review] .n').textContent = RULES.filter(r => r.issues.length && (S.kind === 'all' || r.kind === S.kind)).length;
  document.body.classList.toggle('compact', S.density === 'compact');
  $('#covLink').classList.toggle('on', S.view === 'coverage');
}

/* ---------- scrollspy ---------- */
let current = null, io;
function observe() {
  io = new IntersectionObserver(es => {
    for (const e of es) if (e.isIntersecting) { current = e.target.dataset.g; markToc(current); }
  }, { rootMargin: '-110px 0px -75% 0px' });
  for (const G of GROUPS) io.observe(G.el);
}
let tocOn = null;
function markToc(g) {
  const a = g && document.querySelector(`.toc a[data-toc="${CSS.escape(g)}"]`);
  if (a === tocOn && a?.isConnected) return;
  tocOn?.classList.remove('on');
  tocOn = a;
  if (a) { a.classList.add('on'); if (a.offsetParent) a.scrollIntoView({ block: 'nearest' }); }
}

/* ---------- coverage view ---------- */
async function renderCoverage() {
  const box = $('#coverage');
  if (box.dataset.done) return;
  box.dataset.done = 1;
  box.innerHTML = '<div class="loading">Chargement des exporters…</div>';
  await loadExporters();
  box.innerHTML = `<div class="covh"><h2>Couverture des exporters</h2><p>Part des métriques métier (hors go_/process_) référencées par au moins une règle.</p></div>
  <div class="cov">${EXP.map(e => {
    const cov = e.biz - e.unc.length, pct = e.biz ? Math.round(100 * cov / e.biz) : 0;
    return `<div class="cv"><h4><a href="${esc(e.url)}" target="_blank" rel="noopener" style="text-decoration:none">${esc(e.name)}</a><span class="pct">${pct}%</span></h4>
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="sub">${cov}/${e.biz} métriques · ${e.alerts} alertes</div>
      ${e.unc.length ? `<details><summary>${e.unc.length} non couvertes</summary><ul>${e.unc.map(m => `<li><a href="#/m/${enc(m.name)}">${esc(m.name)}</a></li>`).join('')}</ul></details>` : ''}
    </div>`;
  }).join('')}</div>`;
}

/* ---------- metric drawer ---------- */
function openMetric(name) {
  const d = $('#drawer');
  d.dataset.m = name;
  renderMetric(name);
  d.classList.add('open');
  d.scrollTop = 0;
  if (!lookup(name)?.full) loadExporters().then(() => { if (d.dataset.m === name && d.classList.contains('open')) renderMetric(name); });
}
function renderMetric(name) {
  const i = lookup(name), uses = USES.get(keyOf(name)) || [];
  const d = $('#drawer');
  d.innerHTML = `<div class="dw">
    <button class="act close" data-close>Fermer ✕</button>
    <span class="badge">${esc(i?.type || 'untyped')}</span>${i?.exporter ? ` <span class="badge">${esc(i.exporter)}</span>` : ''}
    <h3>${esc(name)}</h3>
    <p>${esc(i?.help || 'Pas de description dans la fixture.')}</p>
    ${i?.labels?.length ? `<div class="label">Labels</div><div class="lbls">${i.labels.map(l => `<code>${esc(l)}</code>`).join('')}</div>` : ''}
    ${i?.example ? `<div class="label">Exemple</div><pre>${esc(i.example)}</pre>` : ''}
    <div class="label">Règles qui l'utilisent · ${uses.length}</div>
    <div class="rl">${uses.length ? uses.map(o => `<a href="#/r/${enc(o.id)}"><span class="dot ${o.sevk}"></span>${esc(o.name)}<span class="g">${esc(o.group)}</span></a>`).join('') : '<p>Aucune : métrique non couverte.</p>'}</div>
  </div>`;
}
const closeDrawer = () => $('#drawer').classList.remove('open');

/* ---------- command palette (⌘K) ---------- */
const MAC = /Mac|iPhone|iPad/.test(navigator.platform);
$('#palkbd').textContent = MAC ? '⌘K' : 'Ctrl K';
$('#palmod').textContent = MAC ? '⌘' : 'Ctrl';
let PAL = null, palItems = [], palIdx = 0;
function palIndex() {
  if (PAL) return PAL;
  PAL = [];
  for (const [cat, gs] of CATS) {
    const n = gs.reduce((s, G) => s + G.rules.filter(r => r.kind === 'alert').length, 0);
    PAL.push({ t: 'c', key: cat, label: cat, sub: `${gs.map(G => G.name).join(', ')} · ${n} alertes` });
  }
  for (const G of GROUPS) {
    const a = G.rules.filter(r => r.kind === 'alert'), c = a.filter(r => r.severity === 'critical').length;
    PAL.push({ t: 'p', key: G.name, label: G.name, sub: `${a.length} alertes${c ? ` · ${c} critical` : ''}${a.length < G.rules.length ? ` · ${G.rules.length - a.length} records` : ''}` });
  }
  for (const r of RULES) PAL.push({ t: r.kind === 'alert' ? 'a' : 'r', key: r.id, label: r.name, sub: r.group + ' · ' + plain(r.kind === 'alert' ? r.summary : r.expr.replace(/\s+/g, ' ')), sev: r.sevk });
  for (const [m, uses] of USES) if (!RECNAME.has(m)) PAL.push({ t: 'm', key: m, label: m, sub: `${lookup(m)?.exporter || 'prometheus'} · ${uses.length} règle${uses.length > 1 ? 's' : ''}` });
  for (const it of PAL) it.l = it.label.toLowerCase();
  return PAL;
}
// exact > prefix > substring > subsequence; returns -1 when no match
function fuzzy(l, q) {
  if (l === q) return 1000;
  if (l.startsWith(q)) return 800 - l.length;
  const i = l.indexOf(q);
  if (i >= 0) return 600 - i - l.length / 10;
  let j = 0, gaps = 0, last = -1;
  for (let k = 0; k < l.length && j < q.length; k++) if (l[k] === q[j]) { if (last >= 0) gaps += k - last - 1; last = k; j++; }
  return j === q.length && gaps <= Math.max(2, q.length) ? 300 - gaps - l.length / 10 : -1;
}
function hlMatch(label, q) {
  const l = label.toLowerCase(), i = q ? l.indexOf(q) : -1;
  if (i >= 0) return esc(label.slice(0, i)) + '<b>' + esc(label.slice(i, i + q.length)) + '</b>' + esc(label.slice(i + q.length));
  return esc(label);
}
const SECS = [['c', 'Catégories', 4], ['p', 'Produits', 8], ['a', 'Alertes', 8], ['r', 'Recording rules', 4], ['m', 'Métriques', 6]];
// p: products and categories, a: alerts, r: recording rules, m: metrics
const PREFIX = { p: ['c', 'p'], a: ['a'], r: ['r'], m: ['m'] };
function palRender() {
  const raw = $('#palq').value.trimStart().toLowerCase();
  const pm = raw.match(/^([parm]):\s*(.*)$/);
  const only = pm ? PREFIX[pm[1]] : null, q = (pm ? pm[2] : raw).trim();
  const idx = palIndex();
  palItems = [];
  let html = '';
  for (const [t, title, max] of SECS) {
    if (only && !only.includes(t)) continue;
    let xs;
    if (!q) xs = only || t === 'c' || t === 'p' ? idx.filter(i => i.t === t).slice(0, only ? 60 : 99) : [];
    else xs = idx.filter(i => i.t === t).map(i => [i, fuzzy(i.l, q)]).filter(x => x[1] >= 0).sort((a, b) => b[1] - a[1]).slice(0, only ? 40 : max).map(x => x[0]);
    if (!xs.length) continue;
    html += `<div class="palsec">${title}</div>`;
    for (const it of xs) {
      const n = palItems.push(it) - 1;
      const icon = it.t === 'p' ? '<span class="ico p">P</span>' : it.t === 'c' ? '<span class="ico p">C</span>' : it.t === 'm' ? '<span class="ico">M</span>' : `<span class="ico"><span class="dot ${it.sev}"></span></span>`;
      const picked = it.t === 'p' ? S.products.has(it.key) : it.t === 'c' && CATS.get(it.key).every(G => S.products.has(G.name));
      const kind = { c: picked ? 'retirer du filtre' : 'filtrer la catégorie', p: picked ? 'retirer du filtre' : 'filtrer', a: 'aller à l\'alerte', r: 'aller à la règle', m: 'voir la métrique' }[it.t];
      html += `<div class="palit ${picked ? 'picked' : ''}" data-pi="${n}">${icon}<span class="pl ${it.t === 'p' || it.t === 'c' ? '' : 'mono'}">${hlMatch(it.label, q)}</span><span class="ps">${esc(it.sub)}</span><span class="pk">${kind}</span></div>`;
    }
  }
  $('#palres').innerHTML = html || `<div class="palempty">Rien pour « ${esc(q)} ».</div>`;
  palIdx = 0; palMark();
}
function palMark() {
  for (const el of document.querySelectorAll('.palit')) el.classList.toggle('on', +el.dataset.pi === palIdx);
  document.querySelector('.palit.on')?.scrollIntoView({ block: 'nearest' });
}
function palOpen() { $('#pal').hidden = false; $('#palq').value = ''; palRender(); $('#palq').focus(); }
function palClose() { $('#pal').hidden = true; }
function palRun(it, multi) {
  if (!it) return;
  palClose();
  if (it.t === 'p') {
    const next = new Set(multi ? S.products : []);
    if (S.products.has(it.key) && (multi || S.products.size === 1)) next.delete(it.key); else next.add(it.key);
    return setProducts(next);
  }
  if (it.t === 'c') return toggleCat(it.key, multi);
  const h = (it.t === 'm' ? '#/m/' : '#/r/') + enc(it.key);
  if (location.hash === h) route(); else location.hash = h;
}
$('#palq').addEventListener('input', palRender);
$('#palq').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    palIdx = Math.max(0, Math.min(palItems.length - 1, palIdx + (e.key === 'ArrowDown' ? 1 : -1))); palMark();
  } else if (e.key === 'Enter') { e.preventDefault(); palRun(palItems[palIdx], e.metaKey || e.ctrlKey); }
});
$('#palres').addEventListener('mousemove', e => { const el = e.target.closest('.palit'); if (el && +el.dataset.pi !== palIdx) { palIdx = +el.dataset.pi; palMark(); } });
$('#palres').addEventListener('click', e => { const el = e.target.closest('.palit'); if (el) palRun(palItems[+el.dataset.pi], e.metaKey || e.ctrlKey); });
$('#pal').addEventListener('click', e => { if (e.target.id === 'pal') palClose(); });
$('#palbtn').addEventListener('click', palOpen);

/* ---------- routing ---------- */
function setView(v) {
  S.view = v;
  $('#coverage').hidden = v !== 'coverage';
  if (v === 'coverage') renderCoverage();
  syncControls(); applyFilter();
}
function goRule(id) {
  const r = BYID.get(id); if (!r) return;
  if (!visible(r)) { S.q = ''; $('#q').value = ''; S.sev = 'all'; if (S.kind !== 'all' && S.kind !== r.kind) S.kind = r.kind; syncControls(); }
  setView('rules');
  if (S.density === 'compact') r.el.classList.add('open');
  focusRule(r.el, true);
}
function route() {
  const [k, ...rest] = location.hash.replace(/^#\/?/, '').split('/');
  const arg = decodeURIComponent(rest.join('/'));
  if (k === 'coverage') { closeDrawer(); setView('coverage'); scrollTo({ top: 0 }); return; }
  if (k === 'm') { if (S.view !== 'coverage') setView('rules'); openMetric(arg); return; }
  closeDrawer();
  if (k === 'r') return goRule(arg);
  if (k === 'p') { S.products = new Set(arg.split(',').filter(g => GROUPS.some(G => G.name === g))); setView('rules'); return; }
  setView('rules');
  if (k === 'g') { const G = GROUPS.find(x => x.name === arg); if (G) G.el.scrollIntoView(); }
  else applyFilter();
}

/* ---------- keyboard focus ---------- */
let focused = null;
function focusRule(el, flash) {
  if (focused) focused.classList.remove('focus');
  focused = el; el.classList.add('focus');
  el.scrollIntoView({ block: flash ? 'start' : 'nearest' });
  if (flash) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
}
function move(d) {
  const els = RULES.map(r => r.el).filter(el => !el.hidden && !el.parentElement.hidden);
  if (!els.length) return;
  let i = els.indexOf(focused);
  if (i < 0) { const y = 140; i = els.findIndex(el => el.getBoundingClientRect().bottom > y) - (d > 0 ? 1 : 0); }
  focusRule(els[Math.max(0, Math.min(els.length - 1, i + d))]);
}

/* ---------- events ---------- */
let t;
$('#q').addEventListener('input', e => {
  clearTimeout(t);
  t = setTimeout(() => { S.q = e.target.value.trim().toLowerCase(); if (S.view !== 'rules') setView('rules'); else applyFilter(); scrollTo({ top: 0 }); }, 70);
});
addEventListener('hashchange', route);
function toggleCat(cat, multi) {
  const names = CATS.get(cat).map(G => G.name);
  const all = names.every(n => S.products.has(n));
  const next = new Set(multi ? S.products : []);
  if (all && (multi || S.products.size === names.length)) names.forEach(n => next.delete(n)); else names.forEach(n => next.add(n));
  setProducts(next);
}
function setProducts(set) {
  S.products = set;
  history.replaceState(null, '', set.size ? '#/p/' + [...set].map(enc).join(',') : '#/');
  setView('rules'); scrollTo({ top: 0 });
}
$('#gsel').addEventListener('change', e => setProducts(new Set(e.target.value ? [e.target.value] : [])));

document.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]');
  if (c) {
    const r = BYID.get(c.closest('.rule').dataset.id);
    const txt = { expr: r.expr.trim(), yaml: yaml(r), link: location.origin + location.pathname + '#/r/' + enc(r.id) }[c.dataset.copy];
    navigator.clipboard?.writeText(txt);
    const l = c.textContent; c.textContent = 'Copié'; c.classList.add('ok');
    setTimeout(() => { c.textContent = l; c.classList.remove('ok'); }, 1100);
    return;
  }
  const b = e.target.closest('[data-kind],[data-sev],[data-density]');
  if (b) {
    if (b.dataset.kind) S.kind = b.dataset.kind;
    if (b.dataset.sev) S.sev = b.dataset.sev;
    if (b.dataset.density) { S.density = b.dataset.density; try { localStorage.setItem('density', S.density); } catch {} }
    syncControls(); setView('rules');
    if (location.hash.startsWith('#/coverage')) history.replaceState(null, '', '#/');
    return;
  }
  if (e.target.closest('[data-pall]')) { setProducts(new Set()); return; }
  const cb = e.target.closest('[data-cat]');
  if (cb) { toggleCat(cb.dataset.cat, e.metaKey || e.ctrlKey || e.shiftKey); return; }
  if (e.target.closest('[data-review]')) { S.review = !S.review; syncControls(); setView('rules'); scrollTo({ top: 0 }); return; }
  const p = e.target.closest('[data-toc]');
  if (p) {
    e.preventDefault();
    const g = p.dataset.toc, multi = e.metaKey || e.ctrlKey || e.shiftKey;
    const next = new Set(multi ? S.products : []);
    if (multi && S.products.has(g)) next.delete(g);
    else if (!multi && S.products.size === 1 && S.products.has(g)) next.clear();
    else next.add(g);
    setProducts(next);
    return;
  }
  if (e.target.closest('[data-close]')) { closeDrawer(); history.replaceState(null, '', '#/'); return; }
  if (document.body.classList.contains('compact')) {
    const rule = e.target.closest('.rule');
    if (rule && !e.target.closest('a,button,pre')) { rule.classList.toggle('open'); focusRule(rule); return; }
  }
  if ($('#drawer').classList.contains('open') && !e.target.closest('#drawer') && !e.target.closest('a[href^="#/m/"]')) closeDrawer();
});
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#pal').hidden ? palOpen() : palClose(); return; }
  if (!$('#pal').hidden) { if (e.key === 'Escape') palClose(); return; }
  const inInput = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName);
  if (e.key === 'Escape') {
    if ($('#drawer').classList.contains('open')) closeDrawer();
    else if (inInput && S.q) { $('#q').value = ''; S.q = ''; applyFilter(); }
    document.activeElement?.blur(); return;
  }
  if (inInput || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
  if (e.key === 'j' || e.key === 'k') { e.preventDefault(); move(e.key === 'j' ? 1 : -1); return; }
  if (!focused) return;
  if (e.key === 'o' || e.key === 'Enter') focused.classList.toggle('open');
  if (e.key === 'c') focused.querySelector('[data-copy="expr"]').click();
  if (e.key === 'y') focused.querySelector('[data-copy="yaml"]').click();
});

const root = document.documentElement;
new ResizeObserver(([e]) => root.style.setProperty('--top-h', Math.round(e.borderBoxSize[0].blockSize) + 'px')).observe($('.top'));

/* theme */
try { const th = localStorage.getItem('theme'); if (th) root.dataset.theme = th; } catch {}
$('#theme').addEventListener('click', () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme:dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', root.dataset.theme); } catch {}
});

boot().catch(err => { $('#doc').innerHTML = `<div class="empty">Impossible de charger rules.json : ${esc(err.message)}</div>`; });
})();
</script>
