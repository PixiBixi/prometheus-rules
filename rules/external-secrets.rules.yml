- name: external-secrets.rules
  rules:
    # A revoked credential on the secret store fails every ExternalSecret at
    # once while the operator pods stay Running, and already-synced Secrets keep
    # their last value: nothing looks broken until something restarts.
    #
    # A ratio, not a count: large fleets carry a standing floor of objects that
    # fail permanently, so any "> 0" would be chronically firing.
    #
    # The denominator is a max_over_time, NOT a bare count. On an operator
    # restart the per-object series re-register one by one while the failing
    # ones come back first, so a bare count spikes the ratio to 100%.
    - alert: ExternalSecretsSyncDegraded
      expr: |
        count(externalsecret_status_condition{condition="Ready", status="False"} == 1)
        /
        max_over_time(count(externalsecret_status_condition{condition="Ready"} == 1)[1h:1m])
        > 0.05
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "More than 5% of ExternalSecrets are failing to sync"
        description: "{{ $value | humanizePercentage }} of ExternalSecrets have been Ready=False for 15 minutes. A shared cause (secret store credentials, IAM binding) is far more likely than that many independent failures."

    - alert: ExternalSecretsSyncMassFailure
      # The absolute floor stops a cluster holding a single ExternalSecret from
      # paging on one failure, which reads as 100%.
      expr: |
        (
          count(externalsecret_status_condition{condition="Ready", status="False"} == 1)
          /
          max_over_time(count(externalsecret_status_condition{condition="Ready"} == 1)[1h:1m])
          > 0.25
        )
        and
        count(externalsecret_status_condition{condition="Ready", status="False"} == 1) > 10
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Over a quarter of ExternalSecrets are failing to sync"
        description: "{{ $value | humanizePercentage }} of ExternalSecrets, and more than 10 of them, have been Ready=False for 5 minutes. Check the secret store credentials used by the operator."
