- name: aerospike.rules
  rules:
    - alert: AerospikeExporterDown
      expr: |
        # Two distinct failure modes: a failing scrape (up == 0, exporter crashed
        # or host unreachable) and the target vanishing from service discovery,
        # where no up series exists to be 0. Both branches are grouped
        # identically so the alert carries the same labels either way.
        group by (job, instance) (up{job=~".*aerospike.*"} == 0)
        or
        (
          group by (job, instance) (last_over_time(up{job=~".*aerospike.*"}[1h]))
          unless
          group by (job, instance) (last_over_time(up{job=~".*aerospike.*"}[5m]))
        )
      for: 2m
      labels:
        severity: critical
      annotations:
        description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 2 minutes."
        summary: "Job {{ $labels.job }} having an issue on {{ $labels.instance }}"
    - alert: AerospikeDown
      # A restart keeps a node down through cold start, index rebuild and
      # migrations, 10+ minutes on a large dataset, so 2m paged on every planned
      # rolling restart. Losing two nodes at once is AerospikeMultipleNodesDown.
      expr: sum(aerospike_node_up) by (job,instance,cluster_name) == 0
      for: 30m
      labels:
        severity: critical
      annotations:
        description: "{{ $labels.instance }} of cluster {{ $labels.cluster_name }} has been down for more than 2 minutes."
        summary: "Node {{ $labels.instance }} having an issue on {{ $labels.cluster_name }}"
    - alert: AerospikeMultipleNodesDown
      # Replication factor 2 loses data at two nodes down. A rolling restart
      # takes one node at a time, so this stays quiet during maintenance.
      expr: count by (job, cluster_name) (aerospike_node_up == 0) >= 2
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "AS - {{ $value }} nodes down on {{ $labels.cluster_name }}"
        description: "{{ $value }} nodes of cluster {{ $labels.cluster_name }} are down at the same time. With replication factor 2, some partitions have no copy left."
    - alert: NamespaceIsDownWrite
      # The flag oscillates while a node sits on a threshold, which paged once
      # per blip. The 15m window coalesces one outage into a single alert.
      expr: sum(max_over_time(aerospike_namespace_stop_writes[15m])) by (cluster_name,ns,job) > 0
      for: 3m
      labels:
        severity: critical
      annotations:
        summary: "AS - Down write for {{ $labels.ns }} @ {{ $labels.cluster_name }}"
        description: "AS can't write any bin on {{ $labels.ns }} @ {{ $labels.cluster_name }}, please dig ASAP"
    - alert: UnavailablePartitions
      expr: sum(aerospike_namespace_unavailable_partitions) by (ns,cluster_name,job) > 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "AS - Partitions unavailable for {{ $labels.ns }} @ {{ $labels.cluster_name }}"
        description: "AS can't access to all partitions for {{ $labels.ns }} @ {{ $labels.cluster_name }}"
    - alert: DeviceLowOnFreespace
      expr: sum(aerospike_namespace_device_available_pct) by (instance,ns,job) < 15
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "AS - Low Freespace for {{ $labels.ns }} @ {{ $labels.instance }}"
        description: "AS Low Freespace for {{ $labels.ns }} @ {{ $labels.instance }}"
    - alert: RAMExceedHighWatermarkPCT
      expr: 100-(sum(aerospike_namespace_memory_free_pct) by (instance,ns)) > (sum(aerospike_namespace_high_water_memory_pct) by (instance,ns))
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "AS - Low Memory for {{ $labels.ns }} @ {{ $labels.instance }} (< 20%)"
        description: "AS Low Memory for {{ $labels.ns }} @ {{ $labels.instance }}, if it continues, cluster will be down for OOM, please dig"
    - alert: DeviceCloseToStopWrite
      # Alert when used_pct comes within 15 points of the stop-writes threshold.
      # The +15 used to sit on the free_pct side, which expands to
      # used_pct > stop_writes_pct + 15 -- the opposite of the intent, and
      # unreachable with the usual stop_writes_pct of 90 (would need used > 105).
      expr: |
        100 - (sum(aerospike_namespace_memory_free_pct) by (instance,ns))
        > (sum(aerospike_namespace_stop_writes_pct) by (instance,ns)) - 15
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "AS - Stop Write Limit close for {{ $labels.ns }} @ {{ $labels.instance }} (< 15%)"
        description: "AS stop write threshold (aerospike_namespace_stop_writes_pct) for ns={{ $labels.ns }} @ {{ $labels.instance }} is nearly reached - only 15% remaining before writes are blocked."
    # Aerospike 7+: memory_free_pct and stop_writes_pct above no longer exist.
    # Alert on the margin to the threshold the server enforces, not on a fill
    # level: the 1:1 subtraction covers every storage engine and follows a
    # per-namespace override. A threshold of 0 means disabled, hence the > 0.
    - alert: AerospikeAvailCloseToStopWrites
      expr: aerospike_namespace_data_avail_pct - (aerospike_namespace_storage_engine_stop_writes_avail_pct > 0) <= 15
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "AS - avail stop-writes margin low for {{ $labels.ns }} @ {{ $labels.instance }}"
        description: "{{ $labels.ns }} @ {{ $labels.instance }} ({{ $labels.storage_engine }}) is {{ $value | printf \"%.1f\" }} points from its avail stop-writes threshold (<= 15)"
    - alert: AerospikeAvailCloseToStopWritesCritical
      expr: aerospike_namespace_data_avail_pct - (aerospike_namespace_storage_engine_stop_writes_avail_pct > 0) <= 8
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "AS - avail stop-writes margin low for {{ $labels.ns }} @ {{ $labels.instance }}"
        description: "{{ $labels.ns }} @ {{ $labels.instance }} ({{ $labels.storage_engine }}) is {{ $value | printf \"%.1f\" }} points from its avail stop-writes threshold (<= 8)"
    - alert: AerospikeUsedCloseToStopWrites
      expr: (aerospike_namespace_storage_engine_stop_writes_used_pct > 0) - aerospike_namespace_data_used_pct <= 15
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "AS - used stop-writes margin low for {{ $labels.ns }} @ {{ $labels.instance }}"
        description: "{{ $labels.ns }} @ {{ $labels.instance }} ({{ $labels.storage_engine }}) is {{ $value | printf \"%.1f\" }} points from its used stop-writes threshold (<= 15)"
    - alert: AerospikeUsedCloseToStopWritesCritical
      expr: (aerospike_namespace_storage_engine_stop_writes_used_pct > 0) - aerospike_namespace_data_used_pct <= 8
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "AS - used stop-writes margin low for {{ $labels.ns }} @ {{ $labels.instance }}"
        description: "{{ $labels.ns }} @ {{ $labels.instance }} ({{ $labels.storage_engine }}) is {{ $value | printf \"%.1f\" }} points from its used stop-writes threshold (<= 8)"
    - alert: ClockAreUnsync
      # This metric is node-level and carries no ns label; keeping it in the
      # aggregation produced an empty {{ $labels.ns }} in the annotation.
      expr: sum(aerospike_node_stats_cluster_clock_skew_stop_writes_sec) by (cluster_name,instance,job) > 20
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "AS - Clock skew high on {{ $labels.instance }} (> 20s)"
        description: "Ensure clocks are synchronized across the cluster. {{ $labels.instance }} clock skew > 20s"
    - alert: ClockAreUnsyncCritical
      expr: sum(aerospike_node_stats_cluster_clock_skew_stop_writes_sec) by (cluster_name,instance,job) > 40
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "AS - Clock skew critical on {{ $labels.instance }} (> 40s)"
        description: "Ensure clocks are synchronized across the cluster. {{ $labels.instance }} clock skew > 40s - writes may be stopped"
    - alert: AerospikeNamespaceClientTimeoutsHigh
      expr: aerospike:namespace_client_timeout:ratio5m > 1
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "AS - Client timeouts high for {{ $labels.ns }} @ {{ $labels.cluster_name }}"
        description: "{{ $value | printf \"%.2f\" }}% of client transactions on {{ $labels.ns }} @ {{ $labels.cluster_name }} time out (> 1%)"
    - alert: AerospikeNamespaceClientTimeoutsCritical
      expr: aerospike:namespace_client_timeout:ratio5m > 5
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "AS - Client timeouts critical for {{ $labels.ns }} @ {{ $labels.cluster_name }}"
        description: "{{ $value | printf \"%.2f\" }}% of client transactions on {{ $labels.ns }} @ {{ $labels.cluster_name }} time out (> 5%)"
    - alert: LowHeapEfficiency
      expr: sum(aerospike_node_stats_heap_efficiency_pct) by (instance) < 50
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "AS - Heap Efficiency {{ $labels.instance }} (< 50%)"
        description: "Heap efficiency is very low for {{ $labels.instance }} (< 50%). You should check your configuration"
    - alert: AerospikeBackupFail
      expr: backup_aerospike_state < 1
      for: 2m
      labels:
        severity: warning
      annotations:
        description: "The last backup run of {{ $labels.namespace }} reported a failure. A restore would use the previous successful backup: check the backup job logs on {{ $labels.instance }}."
        summary: "Backup for {{ $labels.instance }}/{{ $labels.namespace }} has failed"
    - alert: AerospikePopBackupFail
      expr: sum(backup_aerospike_state) by (pop) == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        description: "No Aerospike backup succeeded in pop {{ $labels.pop }}. A shared cause (storage target, credentials, network) is more likely than a single node."
        summary: "All Aerospike backups for pop {{ $labels.pop }} have failed"
    - alert: AerospikeDeadPartitions
      expr: sum(aerospike_namespace_dead_partitions) by (ns,cluster_name,job) > 0
      for: 3m
      labels:
        severity: critical
      annotations:
        summary: "AS - Dead partitions for {{ $labels.ns }} @ {{ $labels.cluster_name }}"
        description: "{{ $labels.ns }} @ {{ $labels.cluster_name }} has {{ $value | printf \"%.0f\" }} dead partition(s): potential data loss, writes to them are refused until they are revived."
    - alert: AerospikeNamespaceClockSkewStopWrites
      # Distinct from ClockAreUnsync*: this is the namespace flag the server
      # raises once it actually refuses writes because of clock skew.
      expr: aerospike_namespace_clock_skew_stop_writes == 1
      for: 3m
      labels:
        severity: critical
      annotations:
        summary: "AS - Stop-writes due to clock skew for {{ $labels.ns }} @ {{ $labels.cluster_name }}"
        description: "{{ $labels.ns }} @ {{ $labels.cluster_name }} rejects writes because of cluster clock skew, check NTP on every node."
    - alert: AerospikeNodeClockSkew
      expr: aerospike_node_stats_cluster_clock_skew_ms > 2000
      for: 3m
      labels:
        severity: warning
      annotations:
        summary: "AS - Clock skew above 2s on cluster {{ $labels.cluster_name }}"
        description: "Cluster {{ $labels.cluster_name }} clock skew is {{ $value | printf \"%.0f\" }}ms (> 2s) as seen from {{ $labels.instance }}. Ensure clocks are synchronized."
    - alert: AerospikeNodeClockSkewCritical
      expr: aerospike_node_stats_cluster_clock_skew_ms > 20000
      for: 3m
      labels:
        severity: critical
      annotations:
        summary: "AS - Clock skew above 20s on cluster {{ $labels.cluster_name }}"
        description: "Cluster {{ $labels.cluster_name }} clock skew is {{ $value | printf \"%.0f\" }}ms (> 20s) as seen from {{ $labels.instance }}, writes may be stopped."
    - alert: AerospikeLowSystemMemory
      # Hysteresis: once firing it only resolves above 17%, then keeps firing
      # 15m. An integer gauge sitting on 15 flapped the alert every few minutes.
      expr: |
        aerospike_node_stats_system_free_mem_pct < 15
        or
        (aerospike_node_stats_system_free_mem_pct < 17 and on (cluster_name, service) ALERTS{alertname="AerospikeLowSystemMemory", alertstate="firing"})
      for: 3m
      keep_firing_for: 15m
      labels:
        severity: warning
      annotations:
        summary: "AS - Low system memory on {{ $labels.service }} @ {{ $labels.cluster_name }} (< 15%)"
        description: "System free memory of {{ $labels.service }} @ {{ $labels.cluster_name }} is {{ $value | printf \"%.1f\" }}%. Stop-writes triggers at 10% free."
    - alert: AerospikeLowSystemMemoryCritical
      # Stop-writes triggers at 10% free (stop-writes-sys-memory-pct 90): page
      # at 12%, before it, not at it.
      expr: aerospike_node_stats_system_free_mem_pct < 12
      for: 3m
      labels:
        severity: critical
      annotations:
        summary: "AS - Low system memory on {{ $labels.service }} @ {{ $labels.cluster_name }} (< 12%)"
        description: "System free memory of {{ $labels.service }} @ {{ $labels.cluster_name }} is {{ $value | printf \"%.1f\" }}%, close to the 10% stop-writes threshold."
    - alert: AerospikeMigrationsStuck
      # Subquery instead of a recording rule: delta >= 0 over 1h means the
      # remaining partition count never went down.
      expr: |
        sum by (cluster_name, ns) (aerospike_namespace_migrate_tx_partitions_remaining + aerospike_namespace_migrate_rx_partitions_remaining) > 0
        and
        delta(sum by (cluster_name, ns) (aerospike_namespace_migrate_tx_partitions_remaining + aerospike_namespace_migrate_rx_partitions_remaining)[1h:1m]) >= 0
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: "AS - Migrations stuck for {{ $labels.ns }} @ {{ $labels.cluster_name }}"
        description: "{{ $value | printf \"%.0f\" }} partitions of {{ $labels.ns }} @ {{ $labels.cluster_name }} are migrating with no progress for 1h. Migrations delay rolling restarts: check node size and the migrate settings."
    - alert: AerospikeXdrLag
      expr: max by (cluster_name, dc) (aerospike_xdr_lag) > 600
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: "AS - XDR lag to {{ $labels.dc }} from {{ $labels.cluster_name }}"
        description: "XDR lag from {{ $labels.cluster_name }} to {{ $labels.dc }} is {{ $value | humanizeDuration }} (> 10m). The remote datacenter is the fallback for losing a cluster."
