- name: aerospike.rules
  rules:
    - alert: AerospikeExporterDown
      expr: |
        # Two distinct failure modes: a failing scrape (up == 0, exporter crashed
        # or host unreachable) and the target vanishing from service discovery,
        # where no up series exists to be 0. Both branches are grouped
        # identically so the alert carries the same labels either way.
        group by (job, instance) (up{job=~".*aerospike.*"} == 0)
        or
        (
          group by (job, instance) (last_over_time(up{job=~".*aerospike.*"}[1h]))
          unless
          group by (job, instance) (last_over_time(up{job=~".*aerospike.*"}[5m]))
        )
      for: 2m
      labels:
        severity: critical
      annotations:
        description: "{{ $labels.instance }} of job {{ $labels.job }} has been down for more than 2 minutes."
        summary: "Job {{ $labels.job }} having an issue on {{ $labels.instance }}"
    - alert: AerospikeDown
      # A restart keeps a node down through cold start, index rebuild and
      # migrations, 10+ minutes on a large dataset, so 2m paged on every planned
      # rolling restart. Losing two nodes at once is AerospikeMultipleNodesDown.
      expr: sum(aerospike_node_up) by (job,instance,cluster_name) == 0
      for: 30m
      labels:
        severity: critical
      annotations:
        description: "{{ $labels.instance }} of cluster {{ $labels.cluster_name }} has been down for more than 2 minutes."
        summary: "Node {{ $labels.instance }} having an issue on {{ $labels.cluster_name }}"
    - alert: AerospikeMultipleNodesDown
      # Replication factor 2 loses data at two nodes down. A rolling restart
      # takes one node at a time, so this stays quiet during maintenance.
      expr: count by (job, cluster_name) (aerospike_node_up == 0) >= 2
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "AS - {{ $value }} nodes down on {{ $labels.cluster_name }}"
        description: "{{ $value }} nodes of cluster {{ $labels.cluster_name }} are down at the same time. With replication factor 2, some partitions have no copy left."
    - alert: NamespaceIsDownWrite
      # The flag oscillates while a node sits on a threshold, which paged once
      # per blip. The 15m window coalesces one outage into a single alert.
      expr: sum(max_over_time(aerospike_namespace_stop_writes[15m])) by (cluster_name,ns,job) > 0
      for: 3m
      labels:
        severity: critical
      annotations:
        summary: "AS - Down write for {{ $labels.ns }} @ {{ $labels.cluster_name }}"
        description: "AS can't write any bin on {{ $labels.ns }} @ {{ $labels.cluster_name }}, please dig ASAP"
    - alert: UnavailablePartitions
      expr: sum(aerospike_namespace_unavailable_partitions) by (ns,cluster_name,job) > 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "AS - Partitions unavailable for {{ $labels.ns }} @ {{ $labels.cluster_name }}"
        description: "AS can't access to all partitions for {{ $labels.ns }} @ {{ $labels.cluster_name }}"
    - alert: DeviceLowOnFreespace
      expr: sum(aerospike_namespace_device_available_pct) by (instance,ns,job) < 15
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "AS - Low Freespace for {{ $labels.ns }} @ {{ $labels.instance }}"
        description: "AS Low Freespace for {{ $labels.ns }} @ {{ $labels.instance }}"
    - alert: RAMExceedHighWatermarkPCT
      expr: 100-(sum(aerospike_namespace_memory_free_pct) by (instance,ns)) > (sum(aerospike_namespace_high_water_memory_pct) by (instance,ns))
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "AS - Low Memory for {{ $labels.ns }} @ {{ $labels.instance }} (< 20%)"
        description: "AS Low Memory for {{ $labels.ns }} @ {{ $labels.instance }}, if it continues, cluster will be down for OOM, please dig"
    - alert: DeviceCloseToStopWrite
      # Alert when used_pct comes within 15 points of the stop-writes threshold.
      # The +15 used to sit on the free_pct side, which expands to
      # used_pct > stop_writes_pct + 15 -- the opposite of the intent, and
      # unreachable with the usual stop_writes_pct of 90 (would need used > 105).
      expr: |
        100 - (sum(aerospike_namespace_memory_free_pct) by (instance,ns))
        > (sum(aerospike_namespace_stop_writes_pct) by (instance,ns)) - 15
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "AS - Stop Write Limit close for {{ $labels.ns }} @ {{ $labels.instance }} (< 15%)"
        description: "AS stop write threshold (aerospike_namespace_stop_writes_pct) for ns={{ $labels.ns }} @ {{ $labels.instance }} is nearly reached - only 15% remaining before writes are blocked."
    - alert: ClockAreUnsync
      # This metric is node-level and carries no ns label; keeping it in the
      # aggregation produced an empty {{ $labels.ns }} in the annotation.
      expr: sum(aerospike_node_stats_cluster_clock_skew_stop_writes_sec) by (cluster_name,instance,job) > 20
      for: 1m
      labels:
        severity: warning
      annotations:
        summary: "AS - Clock skew high on {{ $labels.instance }} (> 20s)"
        description: "Ensure clocks are synchronized across the cluster. {{ $labels.instance }} clock skew > 20s"
    - alert: ClockAreUnsyncCritical
      expr: sum(aerospike_node_stats_cluster_clock_skew_stop_writes_sec) by (cluster_name,instance,job) > 40
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "AS - Clock skew critical on {{ $labels.instance }} (> 40s)"
        description: "Ensure clocks are synchronized across the cluster. {{ $labels.instance }} clock skew > 40s - writes may be stopped"
    - alert: AerospikeNamespaceClientTimeoutsHigh
      expr: aerospike:namespace_client_timeout:ratio5m > 1
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "AS - Client timeouts high for {{ $labels.ns }} @ {{ $labels.cluster_name }}"
        description: "{{ $value | printf \"%.2f\" }}% of client transactions on {{ $labels.ns }} @ {{ $labels.cluster_name }} time out (> 1%)"
    - alert: AerospikeNamespaceClientTimeoutsCritical
      expr: aerospike:namespace_client_timeout:ratio5m > 5
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "AS - Client timeouts critical for {{ $labels.ns }} @ {{ $labels.cluster_name }}"
        description: "{{ $value | printf \"%.2f\" }}% of client transactions on {{ $labels.ns }} @ {{ $labels.cluster_name }} time out (> 5%)"
    - alert: LowHeapEfficiency
      expr: sum(aerospike_node_stats_heap_efficiency_pct) by (instance) < 50
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "AS - Heap Efficiency {{ $labels.instance }} (< 50%)"
        description: "Heap efficiency is very low for {{ $labels.instance }} (< 50%). You should check your configuration"
    - alert: AerospikeBackupFail
      expr: backup_aerospike_state < 1
      for: 2m
      labels:
        severity: warning
      annotations:
        description: "Backup for {{ $labels.instance }}/{{ $labels.namespace }} has failed"
        summary: "Backup for {{ $labels.instance }}/{{ $labels.namespace }} has failed"
    - alert: AerospikePopBackupFail
      expr: sum(backup_aerospike_state) by (pop) == 0
      for: 2m
      labels:
        severity: critical
      annotations:
        description: "All Aerospike backups for pop {{ $labels.pop }} have failed"
        summary: "All Aerospike backups for pop {{ $labels.pop }} have failed"
