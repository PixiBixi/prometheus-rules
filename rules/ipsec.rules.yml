- name: ipsec.rules
  rules:
    - alert: ExporterIPSECDown
      expr: |
        # Two distinct failure modes: a failing scrape (up == 0, exporter crashed
        # or host unreachable) and the target vanishing from service discovery,
        # where no up series exists to be 0. Both branches are grouped
        # identically so the alert carries the same labels either way.
        group by (job, instance) (up{job="vpn-ipsec"} == 0)
        or
        (
          group by (job, instance) (last_over_time(up{job="vpn-ipsec"}[1h]))
          unless
          group by (job, instance) (last_over_time(up{job="vpn-ipsec"}[5m]))
        )
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "IPSEC Exporter seems down for {{ $labels.instance }}"
        description: "IPSEC Exporter seems down for {{ $labels.instance }}"
    - alert: IPSECDown
      expr: ipsec_status != 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Tunnel {{ $labels.tunnel }} @ {{ $labels.instance }} down"
        description: "Tunnel {{ $labels.tunnel }} @ {{ $labels.instance }} down, check for systemd status and syslog"

