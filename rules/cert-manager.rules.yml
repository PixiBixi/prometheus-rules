- name: cert-manager.rules
  # The aggregations below keep both `namespace` and `exported_namespace` on
  # purpose. Prometheus renames a scraped `namespace` label to
  # `exported_namespace` only when the target already carries one, which is what
  # a Prometheus Operator ServiceMonitor does. Our scrape does not: production
  # shows certmanager_certificate_ready_status{name="...",namespace="..."} with
  # no exported_namespace at all.
  #
  # The annotations therefore prefer exported_namespace and fall back to
  # namespace. Concatenating the two is wrong: on an Operator scrape BOTH exist
  # -- exported_namespace is the certificate's, namespace is the cert-manager
  # pod's -- and you get "teleportmonitoring". Printing only exported_namespace,
  # as they used to, left the namespace blank on ours.
  rules:
    - alert: CertManagerAbsent
      expr: absent(up{job="cert-manager"})
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: "Cert Manager absent from service discovery"
        description: "Cert Manager has disappeared. No certificates can be minted or renewed until it is back."
        runbook_url: https://github.com/imusmanmalik/cert-manager-mixin/blob/main/RUNBOOK.md#certmanagerabsent

    - alert: CertManagerCertExpirySoon
      expr: |
        avg by (exported_namespace, namespace, name) (
          (certmanager_certificate_expiration_timestamp_seconds - time())
          and on (exported_namespace, namespace, name)
          (certmanager_certificate_ready_status{condition="True"} == 1)
        )
        <
        avg by (exported_namespace, namespace, name) (
          certmanager_certificate_expiration_timestamp_seconds - certmanager_certificate_renewal_timestamp_seconds
        ) * 0.7
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: "Certificate {{ $labels.name }} expiring soon ({{ $value | humanizeDuration }})"
        description: "Certificate {{ $labels.name }} in namespace {{ if $labels.exported_namespace }}{{ $labels.exported_namespace }}{{ else }}{{ $labels.namespace }}{{ end }} has not been renewed and is {{ $value | humanizeDuration }} from expiry."
        runbook_url: https://github.com/imusmanmalik/cert-manager-mixin/blob/main/RUNBOOK.md#certmanagercertexpirysoon

    - alert: CertManagerCertNotReady
      expr: |
        max by (name, exported_namespace, namespace, condition) (
          certmanager_certificate_ready_status{condition!="True"} == 1
        )
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: "Certificate {{ $labels.name }} not ready"
        description: "Certificate {{ $labels.name }} in namespace {{ if $labels.exported_namespace }}{{ $labels.exported_namespace }}{{ else }}{{ $labels.namespace }}{{ end }} is not ready (condition={{ $labels.condition }}) for more than 10 minutes."
        runbook_url: https://github.com/imusmanmalik/cert-manager-mixin/blob/main/RUNBOOK.md#certmanagercertnotready

    - alert: CertManagerIssuerNotReady
      # An issuer that stops being ready silently stops renewing every
      # certificate it backs -- expired ACME account, broken DNS solver
      # credentials, unreachable CA. Nothing else here catches that until
      # CertManagerCertExpirySoon fires days later, or a certificate actually
      # expires.
      expr: |
        max by (name, exported_namespace, namespace, condition) (
          certmanager_issuer_ready_status{condition!="True"} == 1
        )
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: "cert-manager Issuer {{ $labels.name }} not ready"
        description: "Issuer {{ $labels.name }} in namespace {{ if $labels.exported_namespace }}{{ $labels.exported_namespace }}{{ else }}{{ $labels.namespace }}{{ end }} is not ready (condition={{ $labels.condition }}). Every certificate it backs has stopped renewing."

    - alert: CertManagerClusterIssuerNotReady
      # Same failure, cluster scope, and worse: a ClusterIssuer usually backs
      # certificates across every namespace. certmanager_clusterissuer_ready_status
      # is a separate metric from the namespaced one, added in recent releases.
      expr: |
        max by (name, condition) (
          certmanager_clusterissuer_ready_status{condition!="True"} == 1
        )
      for: 10m
      labels:
        severity: critical
      annotations:
        summary: "cert-manager ClusterIssuer {{ $labels.name }} not ready"
        description: "ClusterIssuer {{ $labels.name }} is not ready (condition={{ $labels.condition }}). Certificates across every namespace it backs have stopped renewing."

    - alert: CertManagerHittingRateLimits
      expr: |
        sum by (host) (
          rate(certmanager_http_acme_client_request_count{status="429"}[5m])
        ) > 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Cert Manager hitting Let's Encrypt rate limits on {{ $labels.host }}"
        description: "Cert Manager is receiving HTTP 429 from Let's Encrypt for {{ $labels.host }}. Rate limit can block certificate issuance for up to 7 days."
        runbook_url: https://github.com/imusmanmalik/cert-manager-mixin/blob/main/RUNBOOK.md#certmanagerhittingratelimits

    - alert: CertManagerControllerSyncErrors
      expr: rate(certmanager_controller_sync_error_count[5m]) / rate(certmanager_controller_sync_call_count[5m]) > 0.1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Cert Manager controller {{ $labels.controller }} sync error rate is high"
        description: "cert-manager controller {{ $labels.controller }} is failing more than 10% of sync operations. Certificate issuance may be delayed."

    - alert: CertManagerACMEHighErrorRate
      # Must aggregate away `status` before dividing: without it the division matches
      # on the full label set and each error series is divided by itself, giving 1.0.
      expr: |
        sum by (instance, job, host) (rate(certmanager_http_acme_client_request_duration_seconds_count{status=~"4..|5.."}[5m]))
        /
        sum by (instance, job, host) (rate(certmanager_http_acme_client_request_duration_seconds_count[5m]))
        > 0.05
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Cert Manager ACME client high error rate on {{ $labels.host }}"
        description: "cert-manager ACME client has more than 5% error rate ({{ $value | humanizePercentage }}) talking to {{ $labels.host }}."
