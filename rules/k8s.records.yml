- name: k8s.records
  # for unspecified = default (0m)
  #
  # CONSUMED BY GRAFANA DASHBOARDS, NOT BY ALERTS.
  # No alert in this repo references these records, so a grep for consumers
  # will come up empty -- that is expected, do not delete them on that basis.
  # They run every minute over container_cpu_usage_seconds_total and
  # container_memory_working_set_bytes, both high-cardinality cAdvisor metrics,
  # so the evaluation cost is real and deliberate.
  #
  # kube_container_* and kube_namespace_* are already pre-aggregated per pod /
  # per namespace: do not re-aggregate them downstream.
  interval: 1m
  rules:
    - record: kube_container_cpu_usage_5m
      expr: sum by (dc, k8s_cluster_name, namespace, pod) (rate(container_cpu_usage_seconds_total{container!=""}[5m]))

    - record: kube_container_memory_usage
      expr: sum(container_memory_working_set_bytes{image!="",container!=""}) by (dc, k8s_cluster_name, namespace, pod)

    - record: kube_namespace_cpu_limit
      expr: sum by(dc, k8s_cluster_name, namespace, pod) (kube_pod_container_resource_limits{resource="cpu"} * on(namespace,pod,cluster_id,container,instance) group_right kube_pod_container_status_running)

    - record: kube_namespace_cpu_request
      expr: sum by(dc, k8s_cluster_name, namespace, pod) (kube_pod_container_resource_requests{resource="cpu"} * on(namespace,pod,cluster_id,container,instance) group_right kube_pod_container_status_running)

    - record: kube_pod_cpu5m_request_ratio
      expr: kube_container_cpu_usage_5m/kube_namespace_cpu_request

    - record: kube_pod_cpu5m_limit_ratio
      expr: kube_container_cpu_usage_5m/kube_namespace_cpu_limit

    - record: kube_namespace_cpu5m_limit_ratio
      expr: avg(kube_pod_cpu5m_limit_ratio) without(pod)

    - record: kube_namespace_cpu5m_request_ratio
      expr: avg(kube_pod_cpu5m_request_ratio) without(pod)

    - record: kube_namespace_memory_limit
      expr: sum by(dc, k8s_cluster_name, namespace, pod) (kube_pod_container_resource_limits{resource="memory"} * on(namespace,pod,cluster_id,container,instance) group_right kube_pod_container_status_running)

    - record: kube_namespace_memory_request
      expr: sum by(dc, k8s_cluster_name, namespace, pod) (kube_pod_container_resource_requests{resource="memory"} * on(namespace,pod,cluster_id,container,instance) group_right kube_pod_container_status_running)

    - record: kube_pod_memory_request_ratio
      expr: kube_container_memory_usage/kube_namespace_memory_request

    - record: kube_pod_memory_limit_ratio
      expr: kube_container_memory_usage/kube_namespace_memory_limit

    - record: kube_namespace_memory_request_ratio
      expr: avg(kube_pod_memory_request_ratio) without(pod)

    - record: kube_namespace_memory_limit_ratio
      expr: avg(kube_pod_memory_limit_ratio) without(pod)
