- name: basis.records
  # Some records here have no alert consumer (instance:node_memory_utilization:ratio,
  # job:node_cpu_utilization:{min,max}_ratio, and the two NIC saturation ratios).
  # They feed Grafana dashboards -- an empty grep for consumers in rules/ is
  # expected and not grounds for deletion.
  # for unspecified = default (0m)
  interval: 1m
  rules:
    # MemoryRecords
    - record: instance:node_memory_available:ratio
      expr: >
        (
          node_memory_MemAvailable_bytes or
          (
            node_memory_Buffers_bytes +
            node_memory_Cached_bytes +
            node_memory_MemFree_bytes +
            node_memory_Slab_bytes
          )
        ) /
        node_memory_MemTotal_bytes
    - record: instance:node_memory_utilization:ratio
      expr: 1 - instance:node_memory_available:ratio
    # CPURecords
    # The count of CPUs per node, useful for getting CPU time as a percent of total.
    - record: instance:node_cpus:count
      expr: >
        count without (cpu, mode) (
          node_cpu_seconds_total{mode="idle"}
        )
    # CPU in use by CPU.
    - record: instance_cpu:node_cpu_seconds_not_idle:rate1m
      expr: >
        sum without (mode) (
          1 - rate(node_cpu_seconds_total{mode="idle"}[1m])
        )
    # CPU in use by mode.
    # This used to be split in two, with iowait handled by
    # `deriv(...) > 0` and a comment claiming it avoided reset bugs. It is the
    # other way round: deriv() is a linear regression meant for gauges and does
    # no reset detection at all, while rate() handles resets natively.
    # node_cpu_seconds_total is a counter, so rate() is correct for every mode.
    # The `> 0` filter also made the iowait series disappear whenever iowait sat
    # at zero -- the nominal case -- leaving gaps and staleness for any consumer.
    # Merging the two also clears promtool's duplicate-rules lint on this file.
    - record: instance_mode:node_cpu_seconds:rate1m
      expr: >
        sum without (cpu) (
          rate(node_cpu_seconds_total[1m])
        )
    # CPU in use ratio.
    - record: instance:node_cpu_utilization:ratio
      expr: >
        avg without (cpu) (
          instance_cpu:node_cpu_seconds_not_idle:rate1m
        )
    # CPU summaries by servertype/pop
    - record: job:node_cpu_utilization:min_ratio
      expr: >
        min without (fqdn,instance,node,pod) (
          instance:node_cpu_utilization:ratio
        )
    - record: job:node_cpu_utilization:avg_ratio
      expr: >
        avg without (fqdn,instance,node,pod) (
          instance:node_cpu_utilization:ratio
        )
    - record: job:node_cpu_utilization:max_ratio
      expr: >
        max without (fqdn,instance,node,pod) (
          instance:node_cpu_utilization:ratio
        )
    # NIC bandwidth saturation
    - record: instance_device:node_nic_receive_saturation:ratio
      expr: >
        rate(node_network_receive_bytes_total{device!~"lo|veth.*|cali.*|cilium.*|docker.*|virbr.*"}[5m])
        / (node_network_speed_bytes{device!~"lo|veth.*|cali.*|cilium.*|docker.*|virbr.*"} > 0)
    - record: instance_device:node_nic_transmit_saturation:ratio
      expr: >
        rate(node_network_transmit_bytes_total{device!~"lo|veth.*|cali.*|cilium.*|docker.*|virbr.*"}[5m])
        / (node_network_speed_bytes{device!~"lo|veth.*|cali.*|cilium.*|docker.*|virbr.*"} > 0)
